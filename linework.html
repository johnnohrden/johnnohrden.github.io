document.querySelectorAll('#tools [data-tool]').forEach((b) => b.addEventListener('click', () => setTool(b.dataset.tool)));
$('libToggle').addEventListener('click', () => { document.body.classList.toggle('show-lib'); document.body.classList.remove('show-props'); });
$('propsToggle').addEventListener('click', () => { document.body.classList.toggle('show-props'); document.body.classList.remove('show-lib'); });

$('themeBtn').addEventListener('click', () => {
  const next = theme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('jn-theme', next); } catch (e) {}
  buildLibrary(els.libSearch.value);
  panelKey = null;
  render();
});

els.docName.addEventListener('input', () => {
  doc.name = els.docName.value || 'Untitled diagram';
  document.title = `${doc.name} — Linework`;
  markChanged();
});
els.docName.addEventListener('keydown', (e) => { if (e.key === 'Enter') els.docName.blur(); });

function shortcutsHTML() {
  const mod = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl+';
  return `<div class="p-head"><span class="p-title">Shortcuts</span><button class="tb-text" data-act="back" style="color:var(--text-muted)">DONE</button></div>
    <div class="p-sec"><div class="keys">
      ${[
        ['Select tool', 'V'], ['Hand tool', 'H'], ['Text tool', 'T'], ['Line tool', 'L'],
        ['Pan', 'Space + drag'], ['Zoom', `${mod}scroll / pinch`], ['Zoom in / out', `${mod}+ / ${mod}−`], ['Actual size', `${mod}0`], ['Zoom to fit', '⇧1'],
        ['Edit text', 'Enter / type'], ['Finish editing', 'Esc'], ['Undo', `${mod}Z`], ['Redo', `⇧${mod}Z`],
        ['Copy / Paste', `${mod}C / ${mod}V`], ['Duplicate', `${mod}D`], ['Alt-drag', 'duplicate'], ['Delete', '⌫'],
        ['Nudge', 'Arrows (⇧ ×10)'], ['Bring forward', `${mod}]`], ['Send backward', `${mod}[`],
        ['Constrain move', '⇧ + drag'], ['Keep proportions', '⇧ + resize'], ['Skip snapping', `${mod} + drag`],
        ['Save', `${mod}S`], ['Open', `${mod}O`], ['Export PNG', `${mod}E`],
      ].map(([a, k]) => `<span>${a}</span><kbd>${k}</kbd>`).join('')}
    </div></div>`;
}

function showShortcuts() {
  selection.clear();
  showingShortcuts = true;
  panelKey = null;
  document.body.classList.add('show-props');
  render();
}
els.props.addEventListener('click', (e) => {
  if (e.target.closest('[data-act="back"]')) { showingShortcuts = false; panelKey = null; document.body.classList.remove('show-props'); render(); }
});

/* ─── files ─── */
const FILE_TYPES = [{ description: 'Linework diagram', accept: { 'application/json': ['.linework'] } }];
const safeName = (n) => (n || 'diagram').replace(/[\\/:*?"<>|]+/g, '-').trim() || 'diagram';

function serialize() {
  return JSON.stringify({ app: 'linework', version: 1, name: doc.name, shapes: doc.shapes, connectors: doc.connectors }, null, 2);
}

function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function writeHandle(h) {
  const w = await h.createWritable();
  await w.write(serialize());
  await w.close();
  dirty = false;
  autosave();
  toast('Saved ' + h.name);
}

async function save() {
  if (editing) finishEditing();
  if (fileHandle) {
    try { await writeHandle(fileHandle); return; } catch (err) { fileHandle = null; }
  }
  return saveAs();
}

async function saveAs() {
  if (editing) finishEditing();
  const name = safeName(doc.name) + '.linework';
  if (window.showSaveFilePicker) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: name, types: FILE_TYPES });
      fileHandle = h;
      await writeHandle(h);
    } catch (err) {
      if (err.name !== 'AbortError') toast('Could not save: ' + err.message);
    }
  } else {
    downloadBlob(new Blob([serialize()], { type: 'application/json' }), name);
    dirty = false;
    autosave();
    toast('Downloaded ' + name);
  }
  updateSaveState();
}

function hasContent() { return doc.shapes.length > 0 || doc.connectors.length > 0; }

function confirmReplace(what) {
  if (!hasContent()) return true;
  if (fileHandle && !dirty) return true;
  return window.confirm(`${what} will replace the diagram on the canvas. Save it first if you want to keep it.\n\nContinue?`);
}

function loadDoc(data, handle) {
  if (!data || !Array.isArray(data.shapes) || !Array.isArray(data.connectors)) throw new Error('Not a Linework file');
  doc = { app: 'linework', version: 1, name: data.name || 'Untitled diagram', shapes: data.shapes, connectors: data.connectors };
  for (const s of doc.shapes) { s.style = s.style || {}; }
  for (const c of doc.connectors) { c.style = c.style || {}; c.kind = c.kind || 'generic'; }
  fileHandle = handle || null;
  history.undo.length = 0;
  history.redo.length = 0;
  selection.clear();
  dirty = false;
  els.docName.value = doc.name;
  document.title = `${doc.name} — Linework`;
  panelKey = null;
  zoomFit();
  autosave();
}

async function openFile() {
  if (!confirmReplace('Opening a file')) return;
  if (window.showOpenFilePicker) {
    try {
      const [h] = await window.showOpenFilePicker({ types: FILE_TYPES, excludeAcceptAllOption: false });
      const file = await h.getFile();
      loadDoc(JSON.parse(await file.text()), h);
      toast('Opened ' + file.name);
    } catch (err) {
      if (err.name !== 'AbortError') toast('Could not open that file');
    }
  } else {
    $('fileInput').click();
  }
}

$('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try { loadDoc(JSON.parse(await file.text())); toast('Opened ' + file.name); } catch (err) { toast('Could not open that file'); }
});

let dragDepth = 0;
els.stage.addEventListener('dragenter', (e) => { if ([...e.dataTransfer.types].includes('Files')) { dragDepth++; $('dropVeil').hidden = false; } });
els.stage.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('dropVeil').hidden = true; });
els.stage.addEventListener('dragover', (e) => { e.preventDefault(); });
els.stage.addEventListener('drop', async (e) => {
  e.preventDefault();
  dragDepth = 0;
  $('dropVeil').hidden = true;
  const file = e.dataTransfer.files[0];
  if (!file) return;
  if (!confirmReplace('Opening a file')) return;
  try { loadDoc(JSON.parse(await file.text())); toast('Opened ' + file.name); } catch (err) { toast('That isn’t a Linework file'); }
});

function newDiagram() {
  if (!confirmReplace('A new diagram')) return;
  loadDoc(blankDoc());
  const r = canvasRect();
  view = { x: r.width / 2, y: r.height / 2, z: 1 };
  render();
}

function loadTemplate(name) {
  if (!confirmReplace('The template')) return;
  const t = TEMPLATES[name]();
  loadDoc(t);
}

/* ─── export ─── */
let fontCSS = null;
async function embeddedFontCSS() {
  if (fontCSS != null) return fontCSS;
  try {
    const url = 'https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@500&display=swap';
    const css = await (await fetch(url)).text();
    const blocks = css.split('/*').filter((b) => /^\s*latin\s*\*\//.test(b));
    let out = '';
    for (const b of blocks) {
      let block = b.replace(/^\s*latin\s*\*\//, '');
      const m = block.match(/url\((https:[^)]+)\)/);
      if (!m) continue;
      const buf = await (await fetch(m[1])).arrayBuffer();
      let bin = '';
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      block = block.replace(m[1], 'data:font/woff2;base64,' + btoa(bin));
      out += block;
    }
    fontCSS = out;
  } catch (e) {
    fontCSS = '';
  }
  return fontCSS;
}

async function buildExportSVG() {
  if (editing) finishEditing();
  const b = contentBounds();
  if (!b) { toast('Nothing to export yet'); return null; }
  const pad = 36;
  const W = Math.ceil(b.w + pad * 2), H = Math.ceil(b.h + pad * 2);
  const svg = el('svg', { xmlns: SVGNS, width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  const css = await embeddedFontCSS();
  if (css) { const st = el('style', null, el('defs', null, svg)); st.textContent = css; }
  el('rect', { width: W, height: H, fill: color('@canvas') }, svg);
  const g = el('g', { transform: `translate(${pad - b.x} ${pad - b.y})` }, svg);
  for (const s of doc.shapes) g.appendChild(buildShape(s, true));
  for (const c of doc.connectors) g.appendChild(buildConnector(c, true));
  svg.querySelectorAll('[data-hit]').forEach((n) => n.remove());
  svg.querySelectorAll('[data-id]').forEach((n) => n.removeAttribute('data-id'));
  svg.querySelectorAll('[pointer-events]').forEach((n) => n.removeAttribute('pointer-events'));
  return { text: new XMLSerializer().serializeToString(svg), W, H };
}

async function pngBlob() {
  const r = await buildExportSVG();
  if (!r) return null;
  const scale = Math.min(2, 12000 / Math.max(r.W, r.H));
  const url = URL.createObjectURL(new Blob([r.text], { type: 'image/svg+xml' }));
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const cv = document.createElement('canvas');
    cv.width = Math.round(r.W * scale);
    cv.height = Math.round(r.H * scale);
    const ctx = cv.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, r.W, r.H);
    return await new Promise((res) => cv.toBlob(res, 'image/png'));
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function exportPNG() {
  const blob = await pngBlob();
  if (!blob) return;
  downloadBlob(blob, safeName(doc.name) + '.png');
  toast('Exported PNG');
}

async function exportSVG() {
  const r = await buildExportSVG();
  if (!r) return;
  downloadBlob(new Blob([r.text], { type: 'image/svg+xml' }), safeName(doc.name) + '.svg');
  toast('Exported SVG');
}

async function copyPNG() {
  try {
    if (!navigator.clipboard || !window.ClipboardItem) throw new Error('unsupported');
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob().then((b) => { if (!b) throw new Error('empty'); return b; }) })]);
    toast('Image copied to clipboard');
  } catch (e) {
    toast('This browser can’t copy images — use Export PNG');
  }
}

/* ─── boot ─── */
function boot() {
  try {
    const st = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
    if (st) settings = Object.assign(settings, st);
  } catch (e) {}
  buildLibrary();
  let restored = false;
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (saved && saved.doc && Array.isArray(saved.doc.shapes)) {
      doc = saved.doc;
      for (const s of doc.shapes) s.style = s.style || {};
      for (const c of doc.connectors) c.style = c.style || {};
      if (saved.view && isFinite(saved.view.z)) view = saved.view;
      dirty = !!saved.dirty;
      restored = true;
    }
  } catch (e) {}
  els.docName.value = doc.name;
  document.title = `${doc.name} — Linework`;
  if (!restored) {
    const r = canvasRect();
    view = { x: r.width / 2, y: r.height / 2, z: 1 };
  }
  updateSaveState();
  renderNow();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { wrapCache.clear(); render(); });
  }
}

window.addEventListener('resize', () => render());
boot();

</script>
