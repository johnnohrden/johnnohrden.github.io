<script>
/* ═══════════════════════════════════════════
   LINEWORK — core: state, geometry, rendering
══════════════════════════════════════════ */
'use strict';

const SVGNS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
const GRID = 10;
const STORE_KEY = 'linework-doc-v1';
const SETTINGS_KEY = 'linework-settings-v1';
const CLIP_KEY = 'linework-clip-v1';
const FONT_SANS = "'DM Sans', system-ui, -apple-system, sans-serif";
const FONT_MONO = "'DM Mono', ui-monospace, Menlo, monospace";

const els = {
  canvas: $('canvas'), viewport: $('viewport'), shapes: $('shapesLayer'), conns: $('connLayer'),
  preview: $('previewLayer'), overlay: $('overlay'), stage: $('stage'), props: $('props'),
  editor: $('textEditor'), quick: $('quickMenu'), hint: $('emptyHint'), toast: $('toast'),
  zoomLabel: $('zoomLabel'), undo: $('undoBtn'), redo: $('redoBtn'), docName: $('docName'),
  saveState: $('saveState'), libBody: $('libBody'), libSearch: $('libSearch'),
};

/* ─── state ─── */
let doc = blankDoc();
let view = { x: 80, y: 60, z: 1 };
let selection = new Set();
let tool = 'select';
let spaceHeld = false;
const history = { undo: [], redo: [] };
let dirty = false;
let fileHandle = null;
let hoverId = null;
let drag = null;
let editing = null;
let settings = { snap: true, grid: true, linkPreset: 'generic' };
let panelKey = null;

function blankDoc() {
  return { app: 'linework', version: 1, name: 'Untitled diagram', shapes: [], connectors: [] };
}

let idSeq = 0;
function uid(prefix) {
  return prefix + Date.now().toString(36).slice(-5) + (idSeq++).toString(36) + Math.random().toString(36).slice(2, 5);
}

/* ─── theme + colors ─── */
const theme = () => (document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');

function color(c) {
  if (!c || c === 'none') return 'none';
  if (c[0] === '@') return THEME_COLORS[theme()][c] || '#888888';
  return c;
}

function luminance(hex) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map((ch) => ch + ch).join('');
  if (h.length !== 6) return 1;
  const n = parseInt(h, 16);
  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => {
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}

function autoText(fillResolved) {
  if (fillResolved === 'none') return color('@ink');
  return luminance(fillResolved) > 0.36 ? '#0A1F2E' : '#F4F0E4';
}

/* ─── lookups ─── */
const findShape = (id) => doc.shapes.find((s) => s.id === id);
const findConn = (id) => doc.connectors.find((c) => c.id === id);
const findAny = (id) => findShape(id) || findConn(id);
const def = (s) => SHAPES[s.type] || SHAPES.process;
const styleOf = (s) => Object.assign({}, BASE_STYLE, def(s).style, s.style);

const CONN_BASE = { stroke: '@ink', strokeWidth: 1.5, dash: 'solid', start: 'none', end: 'arrow', route: 'elbow', fontSize: 12 };
function connStyle(c) {
  const preset = LINKS[c.kind] || LINKS.generic;
  return Object.assign({}, CONN_BASE, {
    stroke: preset.stroke, strokeWidth: preset.strokeWidth, dash: preset.dash, end: preset.end,
  }, c.style);
}

const selectedShapes = () => [...selection].map(findShape).filter(Boolean);
const selectedConns = () => [...selection].map(findConn).filter(Boolean);

/* ─── svg helper ─── */
function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function dashArray(dash, w) {
  if (dash === 'dashed') return `${Math.max(6, w * 4)} ${Math.max(4, w * 2.6)}`;
  if (dash === 'dotted') return `0.01 ${Math.max(4, w * 2.6)}`;
  return null;
}

/* ─── text measurement ─── */
const measureCtx = document.createElement('canvas').getContext('2d');
const wrapCache = new Map();

function wrapText(text, maxW, size, bold, family = FONT_SANS) {
  const key = `${text}|${Math.round(maxW)}|${size}|${bold}|${family.length}`;
  const hit = wrapCache.get(key);
  if (hit) return hit;
  measureCtx.font = `${bold ? 600 : 400} ${size}px ${family}`;
  const m = (t) => measureCtx.measureText(t).width;
  const out = [];
  for (const para of String(text ?? '').split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const test = line ? `${line} ${word}` : word;
      if (m(test) <= maxW) { line = test; continue; }
      if (line) { out.push(line); line = ''; }
      if (m(word) <= maxW) { line = word; continue; }
      let chunk = '';
      for (const ch of word) {
        if (chunk && m(chunk + ch) > maxW) { out.push(chunk); chunk = ch; } else chunk += ch;
      }
      line = chunk;
    }
    out.push(line);
  }
  if (wrapCache.size > 4000) wrapCache.clear();
  wrapCache.set(key, out);
  return out;
}

function truncate(text, maxW, size, family, weight = 500, spacing = 0) {
  measureCtx.font = `${weight} ${size}px ${family}`;
  const w = (t) => measureCtx.measureText(t).width + t.length * spacing;
  if (w(text) <= maxW) return text;
  let t = text;
  while (t.length > 1 && w(t + '…') > maxW) t = t.slice(0, -1);
  return t + '…';
}

function drawLabel(g, text, box, st, fill, pad = 8) {
  if (!text) return;
  const size = st.fontSize;
  const lines = wrapText(text, Math.max(8, box.w - pad * 2), size, st.bold);
  const lh = size * 1.25;
  const total = lines.length * lh;
  let y0;
  if (st.valign === 'top') y0 = box.y + pad;
  else if (st.valign === 'bottom') y0 = box.y + box.h - pad - total;
  else y0 = box.y + (box.h - total) / 2;
  let x, anchor;
  if (st.align === 'left') { x = box.x + pad; anchor = 'start'; }
  else if (st.align === 'right') { x = box.x + box.w - pad; anchor = 'end'; }
  else { x = box.x + box.w / 2; anchor = 'middle'; }
  const t = el('text', {
    'text-anchor': anchor, 'font-family': FONT_SANS, 'font-size': size,
    'font-weight': st.bold ? 600 : 400, fill, style: 'white-space:pre',
  }, g);
  lines.forEach((ln, i) => {
    const ts = el('tspan', { x, y: +(y0 + i * lh + lh / 2 + size * 0.35).toFixed(2) }, t);
    ts.textContent = ln;
  });
}

function textBoxOf(s) {
  const d = def(s);
  if (d.kind === 'block') return { x: 0, y: 26, w: s.w, h: s.h - 26 };
  if (d.kind === 'container') return { x: 4, y: 2, w: s.w - 8, h: 34 };
  return d.textBox ? d.textBox(s.w, s.h) : { x: 0, y: 0, w: s.w, h: s.h };
}

/* ─── shape rendering ─── */
function buildShape(s, forExport = false) {
  const d = def(s);
  const st = styleOf(s);
  const g = el('g', { 'data-id': s.id, transform: `translate(${s.x} ${s.y})` });
  const fill = color(st.fill);
  const stroke = color(st.stroke);
  const sw = stroke === 'none' ? 0 : st.strokeWidth;
  const common = {
    fill, stroke, 'stroke-width': sw, 'stroke-dasharray': dashArray(st.dash, sw),
    'stroke-linecap': st.dash === 'dotted' ? 'round' : null, 'stroke-linejoin': 'round',
  };
  const tColor = st.textColor === 'auto' ? autoText(d.kind === 'container' ? 'none' : fill) : color(st.textColor);
  const hideText = editing && editing.id === s.id;
  const pe = forExport ? null : 'all';

  switch (d.kind) {
    case 'path':
      el('path', Object.assign({ d: d.path(s.w, s.h), 'pointer-events': pe }, common), g);
      break;

    case 'block': {
      const r = 6, hh = 26;
      el('path', { d: rrect(s.w, s.h, r), fill, stroke: 'none', 'pointer-events': pe }, g);
      if (stroke !== 'none') {
        el('path', {
          d: `M0 ${hh}V${r}A${r} ${r} 0 0 1 ${r} 0H${s.w - r}A${r} ${r} 0 0 1 ${s.w} ${r}V${hh}Z`,
          fill: stroke, 'fill-opacity': 0.13, stroke: 'none',
        }, g);
        el('path', { d: `M0 ${hh}H${s.w}`, stroke, 'stroke-opacity': 0.35, 'stroke-width': 1 }, g);
      }
      el('path', Object.assign({}, common, { d: rrect(s.w, s.h, r), fill: 'none' }), g);
      const ic = el('g', { transform: 'translate(8 5) scale(0.6667)' }, g);
      el('path', {
        d: ICONS[d.icon] || ICONS.module, fill: 'none', stroke: stroke === 'none' ? tColor : stroke,
        'stroke-width': 2.1, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      }, ic);
      const tag = s.tag != null ? s.tag : d.tag;
      if (tag) {
        const tt = el('text', {
          x: 30, y: 17.2, 'font-family': FONT_MONO, 'font-size': 9.5, 'font-weight': 500,
          'letter-spacing': 1.1, fill: stroke === 'none' ? tColor : stroke,
        }, g);
        tt.textContent = truncate(String(tag).toUpperCase(), s.w - 38, 9.5, FONT_MONO, 500, 1.1);
      }
      break;
    }

    case 'bus':
      el('rect', { x: 0, y: 0, width: s.w, height: s.h, rx: Math.min(s.h / 2, 8), fill, stroke, 'stroke-width': sw, 'pointer-events': pe }, g);
      break;

    case 'container': {
      el('path', Object.assign({ d: rrect(s.w, s.h, 6) }, common), g);
      if (!forExport) {
        // selectable by the border and title strip; the inside stays clickable for the canvas
        el('path', { d: rrect(s.w, s.h, 6), fill: 'none', stroke: 'transparent', 'stroke-width': 12, 'pointer-events': 'stroke', 'data-hit': 1 }, g);
        el('rect', { x: 0, y: 0, width: Math.min(s.w, 260), height: 34, fill: 'transparent', 'pointer-events': 'all', 'data-hit': 1 }, g);
        if (fill !== 'none') g.firstChild.setAttribute('pointer-events', 'all');
      }
      break;
    }

    case 'text':
      if (!forExport) el('rect', { x: 0, y: 0, width: s.w, height: s.h, fill: 'transparent', 'pointer-events': 'all', 'data-hit': 1 }, g);
      break;

    case 'legend': {
      const used = [...new Set(doc.connectors.map((c) => c.kind || 'generic'))].filter((k) => LINKS[k]);
      const kinds = used.length ? Object.keys(LINKS).filter((k) => used.includes(k)) : Object.keys(LINKS);
      const need = 40 + kinds.length * 24;
      if (s.h !== need) s.h = need;
      el('path', Object.assign({ d: rrect(s.w, s.h, 4), 'pointer-events': pe }, common), g);
      const title = el('text', { x: 14, y: 23, 'font-family': FONT_MONO, 'font-size': 10, 'font-weight': 500, 'letter-spacing': 1.4, fill: tColor }, g);
      title.textContent = (s.text || 'LEGEND').toUpperCase();
      kinds.forEach((k, i) => {
        const L = LINKS[k];
        const y = 46 + i * 24;
        const stc = color(L.stroke);
        el('path', {
          d: `M14 ${y}H${L.end === 'none' ? 54 : 48}`, stroke: stc, 'stroke-width': L.strokeWidth,
          'stroke-dasharray': dashArray(L.dash, L.strokeWidth), 'stroke-linecap': L.dash === 'dotted' ? 'round' : 'butt',
        }, g);
        if (L.end !== 'none') el('path', { d: `M56 ${y}L47 ${y - 4.5}L47 ${y + 4.5}Z`, fill: stc }, g);
        const lt = el('text', { x: 68, y: y + 4.2, 'font-family': FONT_SANS, 'font-size': 12, fill: tColor }, g);
        lt.textContent = L.name;
      });
      return g;
    }
  }

  if (!hideText) {
    const box = textBoxOf(s);
    const labelStyle = d.kind === 'bus' ? Object.assign({}, st, { bold: true }) : st;
    drawLabel(g, s.text, box, labelStyle, tColor, d.kind === 'text' ? 4 : d.kind === 'container' ? 10 : 8);
  }
  return g;
}

/* ─── ports + connector geometry ─── */
const SLIDES = new Set(['block', 'process', 'rounded', 'predefined', 'container', 'panel', 'bus', 'note', 'text', 'heading']);
const DIR = { top: [0, -1], right: [1, 0], bottom: [0, 1], left: [-1, 0] };

function portsOf(s) {
  const d = def(s);
  const p = d.ports ? d.ports(s.w, s.h) : { top: [s.w / 2, 0], right: [s.w, s.h / 2], bottom: [s.w / 2, s.h], left: [0, s.h / 2] };
  const out = {};
  for (const k in p) out[k] = { x: s.x + p[k][0], y: s.y + p[k][1] };
  return out;
}

function refPoint(end) {
  if (end && end.shape) {
    const s = findShape(end.shape);
    if (s) return end.port ? portsOf(s)[end.port] : { x: s.x + s.w / 2, y: s.y + s.h / 2 };
  }
  return { x: end?.x || 0, y: end?.y || 0 };
}

function sideToward(s, other) {
  const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
  const dx = (other.x - cx) / (s.w / 2 || 1);
  const dy = (other.y - cy) / (s.h / 2 || 1);
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'bottom' : 'top');
}

function resolveEnd(end, other) {
  if (end && end.shape) {
    const s = findShape(end.shape);
    if (s) {
      const side = end.port || sideToward(s, other);
      let p = portsOf(s)[side];
      if (def(s).kind === 'bus' && !end.port) {
        if (side === 'top' || side === 'bottom') p = { x: clamp(other.x, s.x + 8, s.x + s.w - 8), y: p.y };
        else p = { x: p.x, y: clamp(other.y, s.y, s.y + s.h) };
      }
      return { x: p.x, y: p.y, dir: side, box: { x: s.x, y: s.y, w: s.w, h: s.h } };
    }
  }
  return { x: end?.x || 0, y: end?.y || 0, dir: null, box: null };
}

function facing(p, other) {
  const dx = other.x - p.x, dy = other.y - p.y;
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'bottom' : 'top');
}

function connGeometry(c) {
  const ra = refPoint(c.from), rb = refPoint(c.to);
  let a = resolveEnd(c.from, rb);
  let b = resolveEnd(c.to, ra);
  if (c.from.shape && !c.from.port) a = resolveEnd(c.from, b);
  if (c.to.shape && !c.to.port) b = resolveEnd(c.to, a);
  if (!a.dir) a.dir = facing(a, b);
  if (!b.dir) b.dir = facing(b, a);
  const st = connStyle(c);
  if (st.route === 'elbow') {
    // straighten near-aligned links by sliding an auto-attached end along a flat side
    const slide = (p, end, other) => {
      if (!p.box || end.port || !end.shape) return false;
      const s = findShape(end.shape);
      if (!s || !SLIDES.has(def(s).kind === 'block' ? 'block' : s.type)) return false;
      const horiz = p.dir === 'left' || p.dir === 'right';
      const key = horiz ? 'y' : 'x';
      const lo = horiz ? s.y + 8 : s.x + 8, hi = horiz ? s.y + s.h - 8 : s.x + s.w - 8;
      if (Math.abs(p[key] - other[key]) < 16 && other[key] >= lo && other[key] <= hi) { p[key] = other[key]; return true; }
      return false;
    };
    const opposite = { left: 'right', right: 'left', top: 'bottom', bottom: 'top' };
    if (opposite[a.dir] === b.dir && !slide(b, c.to, a)) slide(a, c.from, b);
  }
  if (st.route === 'straight') return { a, b, pts: [a, b], curve: null };
  if (st.route === 'curved') {
    const k = Math.max(30, dist(a, b) * 0.42);
    const c1 = a.box ? { x: a.x + DIR[a.dir][0] * k, y: a.y + DIR[a.dir][1] * k } : { x: a.x, y: a.y };
    const c2 = b.box ? { x: b.x + DIR[b.dir][0] * k, y: b.y + DIR[b.dir][1] * k } : { x: b.x, y: b.y };
    return { a, b, pts: [a, b], curve: [c1, c2] };
  }
  return { a, b, pts: routeOrth(a, b), curve: null };
}

function segHits(p, q, o) {
  if (Math.abs(p.y - q.y) < 0.01) {
    if (p.y <= o.t || p.y >= o.b) return false;
    return Math.max(p.x, q.x) > o.l && Math.min(p.x, q.x) < o.r;
  }
  if (p.x <= o.l || p.x >= o.r) return false;
  return Math.max(p.y, q.y) > o.t && Math.min(p.y, q.y) < o.b;
}

function simplify(pts) {
  const out = [];
  for (const p of pts) {
    const last = out[out.length - 1];
    if (last && Math.abs(last.x - p.x) < 0.5 && Math.abs(last.y - p.y) < 0.5) continue;
    out.push({ x: p.x, y: p.y });
  }
  for (let i = out.length - 2; i > 0; i--) {
    const a = out[i - 1], b = out[i], c = out[i + 1];
    if ((Math.abs(a.x - b.x) < 0.5 && Math.abs(b.x - c.x) < 0.5) || (Math.abs(a.y - b.y) < 0.5 && Math.abs(b.y - c.y) < 0.5)) out.splice(i, 1);
  }
  return out;
}

function routeOrth(a, b) {
  const S = 22, M = 16;
  const off = (p) => (p.box ? { x: p.x + DIR[p.dir][0] * S, y: p.y + DIR[p.dir][1] * S } : { x: p.x, y: p.y });
  const a1 = off(a), b1 = off(b);
  const obst = [a.box, b.box].filter(Boolean).map((r) => ({ l: r.x - M, t: r.y - M, r: r.x + r.w + M, b: r.y + r.h + M }));
  const xs = new Set([a1.x, b1.x, (a1.x + b1.x) / 2]);
  const ys = new Set([a1.y, b1.y, (a1.y + b1.y) / 2]);
  for (const o of obst) { xs.add(o.l); xs.add(o.r); ys.add(o.t); ys.add(o.b); }
  if (obst.length === 2) {
    const [o1, o2] = obst;
    if (o1.r < o2.l) xs.add((o1.r + o2.l) / 2);
    if (o2.r < o1.l) xs.add((o2.r + o1.l) / 2);
    if (o1.b < o2.t) ys.add((o1.b + o2.t) / 2);
    if (o2.b < o1.t) ys.add((o2.b + o1.t) / 2);
  }
  const cands = [[{ x: b1.x, y: a1.y }], [{ x: a1.x, y: b1.y }]];
  for (const x of xs) cands.push([{ x, y: a1.y }, { x, y: b1.y }]);
  for (const y of ys) cands.push([{ x: a1.x, y }, { x: b1.x, y }]);
  for (const x of xs) for (const y of ys) {
    cands.push([{ x: a1.x, y }, { x, y }, { x, y: b1.y }]);
    cands.push([{ x, y: a1.y }, { x, y }, { x: b1.x, y }]);
  }
  let best = null, bestScore = Infinity;
  for (const mid of cands) {
    const raw = [a1, ...mid, b1];
    let score = 0, len = 0;
    for (let i = 0; i < raw.length - 1; i++) {
      const p = raw[i], q = raw[i + 1];
      const L = Math.abs(p.x - q.x) + Math.abs(p.y - q.y);
      if (L < 0.01) continue;
      len += L;
      for (const o of obst) if (segHits(p, q, o)) score += 5000;
    }
    // penalise doubling back over a stub
    if (a.box) {
      const q = raw.find((p, i) => i > 0 && (Math.abs(p.x - a1.x) > 0.5 || Math.abs(p.y - a1.y) > 0.5));
      if (q && ((q.x - a1.x) * DIR[a.dir][0] + (q.y - a1.y) * DIR[a.dir][1]) < -0.5) score += 3000;
    }
    if (b.box) {
      const rev = raw.slice().reverse();
      const q = rev.find((p, i) => i > 0 && (Math.abs(p.x - b1.x) > 0.5 || Math.abs(p.y - b1.y) > 0.5));
      if (q && ((q.x - b1.x) * DIR[b.dir][0] + (q.y - b1.y) * DIR[b.dir][1]) < -0.5) score += 3000;
    }
    const full = simplify([{ x: a.x, y: a.y }, ...raw, { x: b.x, y: b.y }]);
    score += len + (full.length - 2) * 26;
    if (score < bestScore) { bestScore = score; best = full; }
  }
  return best;
}

function polyPath(pts, r = 7) {
  let d = `M${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const p0 = pts[i - 1], p = pts[i], p1 = pts[i + 1];
    const d0 = dist(p0, p), d1 = dist(p, p1);
    const rr = Math.min(r, d0 / 2, d1 / 2);
    if (rr < 0.5 || !d0 || !d1) { d += `L${p.x} ${p.y}`; continue; }
    const u0 = { x: p.x + ((p0.x - p.x) / d0) * rr, y: p.y + ((p0.y - p.y) / d0) * rr };
    const u1 = { x: p.x + ((p1.x - p.x) / d1) * rr, y: p.y + ((p1.y - p.y) / d1) * rr };
    d += `L${u0.x} ${u0.y}Q${p.x} ${p.y} ${u1.x} ${u1.y}`;
  }
  const last = pts[pts.length - 1];
  return d + `L${last.x} ${last.y}`;
}

function arrowHead(kind, tip, from, sw, stroke, g) {
  if (!kind || kind === 'none') return 0;
  const len = dist(tip, from) || 1;
  const ux = (tip.x - from.x) / len, uy = (tip.y - from.y) / len;
  const px = -uy, py = ux;
  const L = 8 + sw * 2.2, W = 4 + sw * 1.3;
  const P = (along, across) => `${(tip.x - ux * along + px * across).toFixed(2)} ${(tip.y - uy * along + py * across).toFixed(2)}`;
  const bg = color('@canvas');
  switch (kind) {
    case 'arrow':
      el('path', { d: `M${P(0, 0)}L${P(L, W)}L${P(L * 0.82, 0)}L${P(L, -W)}Z`, fill: stroke, stroke, 'stroke-width': 1, 'stroke-linejoin': 'round' }, g);
      return L * 0.7;
    case 'open':
      el('path', { d: `M${P(L, W)}L${P(0, 0)}L${P(L, -W)}`, fill: 'none', stroke, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
      return sw / 2;
    case 'diamond':
      el('path', { d: `M${P(0, 0)}L${P(L * 0.75, W)}L${P(L * 1.5, 0)}L${P(L * 0.75, -W)}Z`, fill: stroke, stroke, 'stroke-width': 1 }, g);
      return L * 1.4;
    case 'circle': {
      const r = W * 0.95;
      el('circle', { cx: tip.x - ux * r, cy: tip.y - uy * r, r, fill: bg, stroke, 'stroke-width': Math.max(1.2, sw) }, g);
      return r * 2;
    }
  }
  return 0;
}

function shorten(pts, fromEnd, amount) {
  if (amount <= 0 || pts.length < 2) return;
  const i = fromEnd ? pts.length - 1 : 0;
  const j = fromEnd ? pts.length - 2 : 1;
  const p = pts[i], q = pts[j];
  const L = dist(p, q);
  if (L <= amount + 1) return;
  pts[i] = { x: p.x + ((q.x - p.x) / L) * amount, y: p.y + ((q.y - p.y) / L) * amount };
}

function bezierAt(p0, c1, c2, p1, t) {
  const u = 1 - t;
  return {
    x: u * u * u * p0.x + 3 * u * u * t * c1.x + 3 * u * t * t * c2.x + t * t * t * p1.x,
    y: u * u * u * p0.y + 3 * u * u * t * c1.y + 3 * u * t * t * c2.y + t * t * t * p1.y,
  };
}

function midOfPolyline(pts) {
  let total = 0;
  for (let i = 0; i < pts.length - 1; i++) total += dist(pts[i], pts[i + 1]);
  let half = total / 2;
  for (let i = 0; i < pts.length - 1; i++) {
    const L = dist(pts[i], pts[i + 1]);
    if (half <= L) {
      const t = L ? half / L : 0;
      return { x: pts[i].x + (pts[i + 1].x - pts[i].x) * t, y: pts[i].y + (pts[i + 1].y - pts[i].y) * t };
    }
    half -= L;
  }
  return pts[0];
}

const connCache = new Map();

function buildConnector(c, forExport = false) {
  const st = connStyle(c);
  const geo = connGeometry(c);
  const stroke = color(st.stroke);
  const sw = st.strokeWidth;
  const g = el('g', { 'data-id': c.id });
  const pts = geo.pts.map((p) => ({ x: p.x, y: p.y }));
  let d, labelPos;
  const arrows = el('g', null);

  if (geo.curve) {
    const [c1, c2] = geo.curve;
    const endFrom = dist(c2, geo.b) > 1 ? c2 : geo.a;
    const startFrom = dist(c1, geo.a) > 1 ? c1 : geo.b;
    const e = arrowHead(st.end, geo.b, endFrom, sw, stroke, arrows);
    const s0 = arrowHead(st.start, geo.a, startFrom, sw, stroke, arrows);
    const pb = { x: geo.b.x, y: geo.b.y }, pa = { x: geo.a.x, y: geo.a.y };
    const tmpB = [endFrom, pb]; shorten(tmpB, true, e);
    const tmpA = [pa, startFrom]; shorten(tmpA, false, s0);
    d = `M${tmpA[0].x} ${tmpA[0].y}C${c1.x} ${c1.y} ${c2.x} ${c2.y} ${tmpB[1].x} ${tmpB[1].y}`;
    labelPos = bezierAt(geo.a, c1, c2, geo.b, 0.5);
  } else {
    labelPos = midOfPolyline(pts);
    const e = arrowHead(st.end, pts[pts.length - 1], pts[pts.length - 2], sw, stroke, arrows);
    const s0 = arrowHead(st.start, pts[0], pts[1], sw, stroke, arrows);
    shorten(pts, true, e);
    shorten(pts, false, s0);
    d = polyPath(pts);
  }

  if (!forExport) el('path', { d, fill: 'none', stroke: 'transparent', 'stroke-width': 14, 'pointer-events': 'stroke', 'data-hit': 1 }, g);
  el('path', {
    d, fill: 'none', stroke, 'stroke-width': sw, 'stroke-dasharray': dashArray(st.dash, sw),
    'stroke-linecap': st.dash === 'dotted' ? 'round' : 'butt', 'stroke-linejoin': 'round',
    'pointer-events': forExport ? null : 'none',
  }, g);
  g.appendChild(arrows);

  if (c.text && !(editing && editing.id === c.id)) {
    const size = st.fontSize;
    const lines = String(c.text).split('\n');
    measureCtx.font = `500 ${size}px ${FONT_SANS}`;
    const w = Math.max(...lines.map((l) => measureCtx.measureText(l).width)) + 12;
    const h = lines.length * size * 1.25 + 6;
    el('rect', {
      x: labelPos.x - w / 2, y: labelPos.y - h / 2, width: w, height: h, rx: 3,
      fill: color('@canvas'), 'pointer-events': forExport ? null : 'all',
    }, g);
    const t = el('text', {
      'text-anchor': 'middle', 'font-family': FONT_SANS, 'font-size': size, 'font-weight': 500,
      fill: stroke === 'none' ? color('@ink') : stroke, style: 'white-space:pre',
    }, g);
    lines.forEach((ln, i) => {
      const ts = el('tspan', { x: labelPos.x, y: labelPos.y - h / 2 + 3 + i * size * 1.25 + size * 1.25 / 2 + size * 0.35 }, t);
      ts.textContent = ln;
    });
  }
  if (!forExport) connCache.set(c.id, { geo, labelPos });
  return g;
}

/* ─── coordinates ─── */
function canvasRect() { return els.canvas.getBoundingClientRect(); }
function toWorld(clientX, clientY) {
  const r = canvasRect();
  return { x: (clientX - r.left - view.x) / view.z, y: (clientY - r.top - view.y) / view.z };
}
function toScreen(p) { return { x: p.x * view.z + view.x, y: p.y * view.z + view.y }; }

function bboxOf(shapes) {
  if (!shapes.length) return null;
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
  for (const s of shapes) { l = Math.min(l, s.x); t = Math.min(t, s.y); r = Math.max(r, s.x + s.w); b = Math.max(b, s.y + s.h); }
  return { x: l, y: t, w: r - l, h: b - t };
}

function contentBounds() {
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
  for (const s of doc.shapes) { l = Math.min(l, s.x); t = Math.min(t, s.y); r = Math.max(r, s.x + s.w); b = Math.max(b, s.y + s.h); }
  for (const c of doc.connectors) {
    const geo = connGeometry(c);
    const pts = geo.curve ? [geo.a, geo.b, ...geo.curve] : geo.pts;
    for (const p of pts) { l = Math.min(l, p.x); t = Math.min(t, p.y); r = Math.max(r, p.x); b = Math.max(b, p.y); }
  }
  if (l === Infinity) return null;
  return { x: l, y: t, w: r - l, h: b - t };
}

const inside = (o, s) => o.x >= s.x && o.y >= s.y && o.x + o.w <= s.x + s.w && o.y + o.h <= s.y + s.h;

function shapeAt(p, excludeId) {
  for (let i = doc.shapes.length - 1; i >= 0; i--) {
    const s = doc.shapes[i];
    const k = def(s).kind;
    if (s.id === excludeId || k === 'container' || k === 'legend') continue;
    if (p.x >= s.x - 4 && p.x <= s.x + s.w + 4 && p.y >= s.y - 4 && p.y <= s.y + s.h + 4) return s;
  }
  const tol = 10 / view.z;
  for (let i = doc.shapes.length - 1; i >= 0; i--) {
    const s = doc.shapes[i];
    if (s.id === excludeId || def(s).kind !== 'container') continue;
    const inOuter = p.x >= s.x - tol && p.x <= s.x + s.w + tol && p.y >= s.y - tol && p.y <= s.y + s.h + tol;
    const inInner = p.x > s.x + tol && p.x < s.x + s.w - tol && p.y > s.y + 34 && p.y < s.y + s.h - tol;
    if (inOuter && !inInner) return s;
  }
  return null;
}

/* ─── render loop ─── */
let renderQueued = false;
function render() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(renderNow);
}

function renderNow() {
  renderQueued = false;
  const { x, y, z } = view;
  els.viewport.setAttribute('transform', `translate(${x} ${y}) scale(${z})`);

  const minor = $('gridMinor'), major = $('gridMajor');
  const m = GRID * z, M = GRID * 5 * z;
  minor.setAttribute('width', m); minor.setAttribute('height', m);
  minor.firstElementChild.setAttribute('d', `M${m} 0H0V${m}`);
  minor.firstElementChild.style.display = m < 6 ? 'none' : '';
  major.setAttribute('width', M); major.setAttribute('height', M);
  major.setAttribute('x', x); major.setAttribute('y', y);
  minor.setAttribute('x', 0); minor.setAttribute('y', 0);
  major.firstElementChild.setAttribute('width', M); major.firstElementChild.setAttribute('height', M);
  major.lastElementChild.setAttribute('d', `M${M} 0H0V${M}`);
  $('gridRect').style.display = settings.grid ? '' : 'none';

  els.shapes.replaceChildren(...doc.shapes.map((s) => buildShape(s)));
  connCache.clear();
  els.conns.replaceChildren(...doc.connectors.map((c) => buildConnector(c)));
  renderPreview();
  renderOverlay();

  els.hint.hidden = doc.shapes.length > 0 || doc.connectors.length > 0;
  els.zoomLabel.textContent = Math.round(z * 100) + '%';
  els.undo.disabled = !history.undo.length;
  els.redo.disabled = !history.redo.length;
  els.canvas.className.baseVal = `tool-${tool}${spaceHeld ? ' panning' : ''}`;
  if (editing) positionEditor();
  refreshPanel();
}

function renderPreview() {
  els.preview.replaceChildren();
  if (!drag || drag.type !== 'connect' || !drag.moved) return;
  const fake = {
    id: '__preview', kind: settings.linkPreset, from: drag.from,
    to: drag.target ? { shape: drag.target, port: drag.targetPort || null } : { x: drag.cur.x, y: drag.cur.y },
    style: {}, text: '',
  };
  const g = buildConnector(fake, true);
  g.setAttribute('opacity', 0.75);
  els.preview.appendChild(g);
}

function renderOverlay() {
  const o = els.overlay;
  o.replaceChildren();
  const z = view.z;
  const S = (p) => toScreen(p);
  const rectFor = (s, pad = 0) => {
    const p = S({ x: s.x, y: s.y });
    return { x: p.x - pad, y: p.y - pad, width: s.w * z + pad * 2, height: s.h * z + pad * 2 };
  };
  const shapesSel = selectedShapes();
  const connsSel = selectedConns();
  const busy = drag && ['move', 'resize', 'pan', 'marquee', 'lib'].includes(drag.type) && drag.moved !== false;

  // hover outline
  if (!drag && hoverId && !selection.has(hoverId)) {
    const s = findShape(hoverId);
    if (s) el('rect', Object.assign({ class: 'hover-box', rx: 2 }, rectFor(s, 2)), o);
  }

  // connect target
  if (drag && (drag.type === 'connect' || drag.type === 'reconnect') && drag.target) {
    const s = findShape(drag.target);
    if (s) el('rect', Object.assign({ class: 'target-box', rx: 3 }, rectFor(s, 3)), o);
  }

  // selection
  for (const s of shapesSel) el('rect', Object.assign({ class: 'sel-box' }, rectFor(s, 1)), o);
  if (shapesSel.length > 1) {
    const bb = bboxOf(shapesSel);
    el('rect', Object.assign({ class: 'sel-group' }, rectFor(bb, 6)), o);
  }

  const single = shapesSel.length === 1 && connsSel.length === 0 ? shapesSel[0] : null;
  if (single && !busy && !(editing && editing.id === single.id)) {
    const r = rectFor(single, 1);
    const k = def(single).kind;
    const hs = 8;
    const dirs = k === 'bus'
      ? { w: [r.x, r.y + r.height / 2], e: [r.x + r.width, r.y + r.height / 2] }
      : {
        nw: [r.x, r.y], n: [r.x + r.width / 2, r.y], ne: [r.x + r.width, r.y], e: [r.x + r.width, r.y + r.height / 2],
        se: [r.x + r.width, r.y + r.height], s: [r.x + r.width / 2, r.y + r.height], sw: [r.x, r.y + r.height], w: [r.x, r.y + r.height / 2],
      };
    if (k === 'legend') { delete dirs.n; delete dirs.s; delete dirs.ne; delete dirs.nw; delete dirs.se; delete dirs.sw; }
    const cursors = { nw: 'nwse-resize', se: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize', n: 'ns-resize', s: 'ns-resize', e: 'ew-resize', w: 'ew-resize' };
    for (const [dname, [hx, hy]] of Object.entries(dirs)) {
      el('rect', {
        class: 'h-resize', x: hx - hs / 2, y: hy - hs / 2, width: hs, height: hs, rx: 1.5,
        'data-handle': 'resize', 'data-shape': single.id, 'data-dir': dname, style: `cursor:${cursors[dname]}`,
      }, o);
    }
    if (['path', 'block'].includes(k) && r.width > 24) {
      const ports = portsOf(single);
      const gap = 24;
      for (const [side, p] of Object.entries(ports)) {
        const sp = S(p);
        const cx = sp.x + DIR[side][0] * gap, cy = sp.y + DIR[side][1] * gap;
        const qg = el('g', { 'data-handle': 'quick', 'data-shape': single.id, 'data-port': side, class: 'h-quick-g' }, o);
        el('circle', { cx, cy, r: 9, fill: 'transparent' }, qg);
        const ang = { top: -90, right: 0, bottom: 90, left: 180 }[side];
        el('path', {
          class: 'h-quick', d: 'M-3.5 -5.5L4.5 0L-3.5 5.5Z',
          transform: `translate(${cx} ${cy}) rotate(${ang})`,
        }, qg);
      }
    }
  }

  // ports on hover / connect target
  let portShape = null;
  if (drag && (drag.type === 'connect' || drag.type === 'reconnect')) portShape = drag.target ? findShape(drag.target) : null;
  else if (!drag && (tool === 'select' || tool === 'line')) portShape = findShape(hoverId) || (single && !editing ? single : null);
  if (portShape && !['legend', 'text'].includes(def(portShape).kind)) {
    for (const [side, p] of Object.entries(portsOf(portShape))) {
      const sp = S(p);
      const hot = drag && drag.targetPort === side;
      el('circle', {
        class: 'h-port' + (hot ? ' is-hot' : ''), cx: sp.x, cy: sp.y, r: hot ? 6 : 4.5,
        'data-handle': 'port', 'data-shape': portShape.id, 'data-port': side,
      }, o);
    }
  }

  // connector endpoints
  if (!busy) {
    for (const c of connsSel) {
      const cc = connCache.get(c.id);
      if (!cc) continue;
      for (const [end, p] of [['from', cc.geo.a], ['to', cc.geo.b]]) {
        const sp = S(p);
        el('circle', { class: 'h-end', cx: sp.x, cy: sp.y, r: 5.5, 'data-handle': 'end', 'data-conn': c.id, 'data-end': end }, o);
      }
    }
  }

  // alignment guides
  if (drag && drag.guides) {
    for (const gd of drag.guides) {
      const p1 = S({ x: gd.x1, y: gd.y1 }), p2 = S({ x: gd.x2, y: gd.y2 });
      el('line', { class: 'guide', x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y }, o);
    }
  }

  // marquee
  if (drag && drag.type === 'marquee' && drag.moved) {
    const p1 = S(drag.p0), p2 = S(drag.cur);
    el('rect', { class: 'marquee', x: Math.min(p1.x, p2.x), y: Math.min(p1.y, p2.y), width: Math.abs(p1.x - p2.x), height: Math.abs(p1.y - p2.y) }, o);
  }

  // size readout while resizing
  if (drag && drag.type === 'resize') {
    const s = findShape(drag.id);
    if (s) {
      const r = rectFor(s);
      const label = `${Math.round(s.w)} × ${Math.round(s.h)}`;
      const tw = label.length * 6.6 + 12;
      const tg = el('g', { class: 'size-tip' }, o);
      el('rect', { x: r.x + r.width / 2 - tw / 2, y: r.y + r.height + 10, width: tw, height: 20, rx: 4 }, tg);
      const t = el('text', { x: r.x + r.width / 2, y: r.y + r.height + 24, 'text-anchor': 'middle' }, tg);
      t.textContent = label;
    }
  }
}

/* ═══════════════════════════════════════════
   LINEWORK — interaction, panels, files
══════════════════════════════════════════ */

/* ─── history ─── */
const snapshot = () => JSON.stringify({ shapes: doc.shapes, connectors: doc.connectors });

function commit(before) {
  if (snapshot() === before) { render(); return false; }
  history.undo.push(before);
  if (history.undo.length > 300) history.undo.shift();
  history.redo.length = 0;
  markChanged();
  render();
  return true;
}

function restore(json) {
  const d = JSON.parse(json);
  doc.shapes = d.shapes;
  doc.connectors = d.connectors;
  selection = new Set([...selection].filter((id) => findAny(id)));
  panelKey = null;
  markChanged();
  render();
}

function undo() {
  if (editing) finishEditing();
  if (!history.undo.length) return;
  history.redo.push(snapshot());
  restore(history.undo.pop());
}

function redo() {
  if (editing) finishEditing();
  if (!history.redo.length) return;
  history.undo.push(snapshot());
  restore(history.redo.pop());
}

/* ─── persistence ─── */
let autosaveTimer = null;
function markChanged() {
  dirty = true;
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(autosave, 350);
  updateSaveState();
}

function autosave() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ doc, view, dirty, fileName: fileHandle ? fileHandle.name : null }));
  } catch (e) { /* storage unavailable — keep working in memory */ }
  updateSaveState();
}

function updateSaveState() {
  let label = 'Autosaved in browser';
  if (fileHandle) label = dirty ? 'Unsaved changes' : 'Saved to ' + fileHandle.name;
  els.saveState.textContent = label;
}

function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
}

let toastTimer = null;
function toast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1800);
}

/* ─── creating things ─── */
function snapV(v) { return settings.snap ? Math.round(v / GRID) * GRID : Math.round(v); }

function createShape(type, cx, cy, opts = {}) {
  const d = SHAPES[type];
  const w = opts.w || d.w, h = opts.h || d.h;
  const s = {
    id: uid('s'), type, x: snapV(cx - w / 2), y: snapV(cy - h / 2), w, h,
    text: opts.text != null ? opts.text : d.text, style: opts.style ? JSON.parse(JSON.stringify(opts.style)) : {},
  };
  if (d.kind === 'block') s.tag = opts.tag != null ? opts.tag : d.tag;
  return s;
}

function addShape(s) {
  if (def(s).kind === 'container') {
    const firstNonContainer = doc.shapes.findIndex((o) => def(o).kind !== 'container');
    if (firstNonContainer === -1) doc.shapes.push(s); else doc.shapes.splice(firstNonContainer, 0, s);
  } else doc.shapes.push(s);
  return s;
}

function viewCenterWorld() {
  const r = canvasRect();
  return toWorld(r.left + r.width / 2, r.top + r.height / 2);
}

function addFromLibrary(type, at) {
  const before = snapshot();
  let p = at || viewCenterWorld();
  if (!at) {
    // avoid stacking repeated clicks exactly on top of each other
    let n = 0;
    while (n < 12 && doc.shapes.some((o) => Math.abs(o.x + o.w / 2 - p.x) < 4 && Math.abs(o.y + o.h / 2 - p.y) < 4)) { p = { x: p.x + 30, y: p.y + 30 }; n++; }
  }
  const s = addShape(createShape(type, p.x, p.y));
  selection = new Set([s.id]);
  commit(before);
  document.body.classList.remove('show-lib');
  return s;
}

/* ─── selection ops ─── */
function deleteSelection() {
  if (!selection.size) return;
  const before = snapshot();
  const ids = new Set(selection);
  doc.shapes = doc.shapes.filter((s) => !ids.has(s.id));
  doc.connectors = doc.connectors.filter((c) => !ids.has(c.id) && !ids.has(c.from.shape) && !ids.has(c.to.shape));
  selection.clear();
  commit(before);
}

function cloneItems(ids, offset) {
  const shapeIds = new Set([...ids].filter((id) => findShape(id)));
  const shapes = doc.shapes.filter((s) => shapeIds.has(s.id));
  const conns = doc.connectors.filter((c) => ids.has(c.id) || (shapeIds.has(c.from.shape) && shapeIds.has(c.to.shape)));
  const data = { shapes: JSON.parse(JSON.stringify(shapes)), connectors: [] };
  for (const c of conns) {
    const cc = JSON.parse(JSON.stringify(c));
    for (const end of ['from', 'to']) {
      if (cc[end].shape && !shapeIds.has(cc[end].shape)) {
        const geo = connGeometry(c);
        const p = end === 'from' ? geo.a : geo.b;
        cc[end] = { x: p.x, y: p.y };
      }
    }
    data.connectors.push(cc);
  }
  return data;
}

function pasteData(data, offset) {
  if (!data || (!data.shapes?.length && !data.connectors?.length)) return;
  const before = snapshot();
  const map = new Map();
  const newSel = new Set();
  for (const s of data.shapes) {
    const n = Object.assign({}, JSON.parse(JSON.stringify(s)), { id: uid('s'), x: s.x + offset, y: s.y + offset });
    map.set(s.id, n.id);
    addShape(n);
    newSel.add(n.id);
  }
  for (const c of data.connectors) {
    const n = JSON.parse(JSON.stringify(c));
    n.id = uid('c');
    for (const end of ['from', 'to']) {
      if (n[end].shape) n[end].shape = map.get(n[end].shape);
      else { n[end].x += offset; n[end].y += offset; }
    }
    doc.connectors.push(n);
    newSel.add(n.id);
  }
  selection = newSel;
  commit(before);
}

let pasteCount = 0;
let memClip = null;
function copySelection(cut) {
  if (!selection.size) return;
  memClip = cloneItems(selection);
  try { localStorage.setItem(CLIP_KEY, JSON.stringify(memClip)); } catch (e) {}
  pasteCount = 0;
  if (cut) deleteSelection(); else toast('Copied');
}

function paste() {
  let data = memClip;
  try { const s = localStorage.getItem(CLIP_KEY); if (s) data = JSON.parse(s); } catch (e) {}
  if (!data) return;
  pasteCount++;
  pasteData(data, 20 * pasteCount);
}

function duplicate() {
  if (!selection.size) return;
  pasteData(cloneItems(selection), 20);
}

function selectAll() {
  selection = new Set([...doc.shapes.map((s) => s.id), ...doc.connectors.map((c) => c.id)]);
  render();
}

function reorder(mode) {
  const sel = selectedShapes();
  if (!sel.length) return;
  const before = snapshot();
  const ids = new Set(sel.map((s) => s.id));
  if (mode === 'front') doc.shapes = [...doc.shapes.filter((s) => !ids.has(s.id)), ...sel];
  else if (mode === 'back') doc.shapes = [...sel, ...doc.shapes.filter((s) => !ids.has(s.id))];
  else if (mode === 'forward') {
    for (let i = doc.shapes.length - 2; i >= 0; i--) {
      if (ids.has(doc.shapes[i].id) && !ids.has(doc.shapes[i + 1].id)) [doc.shapes[i], doc.shapes[i + 1]] = [doc.shapes[i + 1], doc.shapes[i]];
    }
  } else if (mode === 'backward') {
    for (let i = 1; i < doc.shapes.length; i++) {
      if (ids.has(doc.shapes[i].id) && !ids.has(doc.shapes[i - 1].id)) [doc.shapes[i], doc.shapes[i - 1]] = [doc.shapes[i - 1], doc.shapes[i]];
    }
  }
  commit(before);
}

function align(mode) {
  const sel = selectedShapes();
  if (sel.length < 2) return;
  const before = snapshot();
  const bb = bboxOf(sel);
  for (const s of sel) {
    if (mode === 'left') s.x = bb.x;
    if (mode === 'center') s.x = bb.x + bb.w / 2 - s.w / 2;
    if (mode === 'right') s.x = bb.x + bb.w - s.w;
    if (mode === 'top') s.y = bb.y;
    if (mode === 'middle') s.y = bb.y + bb.h / 2 - s.h / 2;
    if (mode === 'bottom') s.y = bb.y + bb.h - s.h;
  }
  commit(before);
}

function distribute(axis) {
  const sel = selectedShapes();
  if (sel.length < 3) return;
  const before = snapshot();
  const pos = axis === 'h' ? 'x' : 'y', size = axis === 'h' ? 'w' : 'h';
  sel.sort((a, b) => a[pos] - b[pos]);
  const first = sel[0], last = sel[sel.length - 1];
  const span = last[pos] + last[size] - first[pos];
  const used = sel.reduce((t, s) => t + s[size], 0);
  const gap = (span - used) / (sel.length - 1);
  let cur = first[pos];
  for (const s of sel) { s[pos] = Math.round(cur); cur += s[size] + gap; }
  commit(before);
}

function nudge(dx, dy) {
  const sel = selectedShapes();
  if (!sel.length) return;
  const before = snapshot();
  for (const s of sel) { s.x += dx; s.y += dy; }
  commit(before);
}

/* ─── view ─── */
function zoomAt(factor, sx, sy) {
  const nz = clamp(view.z * factor, 0.1, 4);
  const wx = (sx - view.x) / view.z, wy = (sy - view.y) / view.z;
  view.z = nz;
  view.x = sx - wx * nz;
  view.y = sy - wy * nz;
  render();
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(autosave, 600);
}

function zoomCenter(factor) {
  const r = canvasRect();
  zoomAt(factor, r.width / 2, r.height / 2);
}

function zoomTo(z) { zoomCenter(z / view.z); }

function zoomFit() {
  const r = canvasRect();
  const b = contentBounds();
  if (!b) { view = { x: r.width / 2, y: r.height / 2, z: 1 }; render(); return; }
  const pad = r.width < 600 ? 24 : 72;
  const z = clamp(Math.min((r.width - pad * 2) / Math.max(b.w, 1), (r.height - pad * 2) / Math.max(b.h, 1)), 0.1, 1.25);
  view.z = z;
  view.x = r.width / 2 - (b.x + b.w / 2) * z;
  view.y = r.height / 2 - (b.y + b.h / 2) * z;
  render();
}

function setTool(t) {
  tool = t;
  document.querySelectorAll('#tools [data-tool]').forEach((b) => b.classList.toggle('is-active', b.dataset.tool === t));
  render();
}

/* ─── snapping ─── */
function smartSnap(box, moving, noSnap) {
  if (noSnap || !settings.snap) return { x: box.x, y: box.y, guides: [] };
  const th = 6 / view.z;
  const mineX = [box.x, box.x + box.w / 2, box.x + box.w];
  const mineY = [box.y, box.y + box.h / 2, box.y + box.h];
  let bx = { d: Infinity }, by = { d: Infinity };
  for (const s of doc.shapes) {
    if (moving.has(s.id)) continue;
    const xs = [s.x, s.x + s.w / 2, s.x + s.w], ys = [s.y, s.y + s.h / 2, s.y + s.h];
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      const dx = xs[j] - mineX[i];
      if (Math.abs(dx) < Math.abs(bx.d)) bx = { d: dx, v: xs[j], s };
      const dy = ys[j] - mineY[i];
      if (Math.abs(dy) < Math.abs(by.d)) by = { d: dy, v: ys[j], s };
    }
  }
  let x = box.x, y = box.y;
  const guides = [];
  if (Math.abs(bx.d) <= th) x += bx.d; else x = Math.round(x / GRID) * GRID;
  if (Math.abs(by.d) <= th) y += by.d; else y = Math.round(y / GRID) * GRID;
  if (Math.abs(bx.d) <= th) {
    const s = bx.s;
    guides.push({ x1: bx.v, y1: Math.min(y, s.y) - 12, x2: bx.v, y2: Math.max(y + box.h, s.y + s.h) + 12 });
  }
  if (Math.abs(by.d) <= th) {
    const s = by.s;
    guides.push({ x1: Math.min(x, s.x) - 12, y1: by.v, x2: Math.max(x + box.w, s.x + s.w) + 12, y2: by.v });
  }
  return { x, y, guides };
}

/* ─── pointer interaction ─── */
const pointers = new Map();
let pinch = null;

function startMove(w, alt, clickSelect) {
  const before = snapshot();
  if (alt) {
    const data = cloneItems(selection);
    pasteData(data, 0);
    history.undo.pop(); // fold the duplicate into this drag's single undo step
  }
  const ids = new Set(selectedShapes().map((s) => s.id));
  for (const id of [...ids]) {
    const s = findShape(id);
    if (def(s).kind === 'container') for (const o of doc.shapes) if (o !== s && inside(o, s)) ids.add(o.id);
  }
  const starts = new Map([...ids].map((id) => { const s = findShape(id); return [id, { x: s.x, y: s.y }]; }));
  const freeEnds = [];
  for (const c of doc.connectors) {
    const selected = selection.has(c.id);
    for (const end of ['from', 'to']) {
      if (!c[end].shape && (selected || (ids.size && [c.from.shape, c.to.shape].some((sid) => sid && ids.has(sid))))) {
        freeEnds.push({ c, end, x: c[end].x, y: c[end].y });
      }
    }
  }
  drag = { type: 'move', p0: w, starts, freeEnds, before, bbox: bboxOf([...ids].map(findShape)), moved: false, clickSelect, alt };
}

function handleDown(e) {
  if (e.button === 2) return;
  closeMenus();
  if (!els.quick.hidden) hideQuickMenu();
  if (editing) finishEditing();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    if (drag && drag.before) restore(drag.before);
    drag = null;
    const [p1, p2] = [...pointers.values()];
    pinch = { d: Math.hypot(p1.x - p2.x, p1.y - p2.y), mid: { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }, view: { ...view } };
    return;
  }
  if (pointers.size > 2) return;
  e.preventDefault();
  const ae = document.activeElement;
  if (ae && ae !== document.body && ae.blur) ae.blur();
  const w = toWorld(e.clientX, e.clientY);
  const handle = e.target.closest && e.target.closest('[data-handle]');
  const hit = e.target.closest && e.target.closest('#shapesLayer [data-id], #connLayer [data-id]');

  const now = performance.now();
  const hitId = hit ? hit.dataset.id : null;
  const isDouble = e.button === 0 && !handle && lastDown && now - lastDown.t < 420 &&
    Math.hypot(e.clientX - lastDown.x, e.clientY - lastDown.y) < 8 && lastDown.id === hitId;
  lastDown = { t: isDouble ? 0 : now, x: e.clientX, y: e.clientY, id: hitId };
  if (isDouble && tool !== 'hand' && !spaceHeld) {
    drag = null;
    handleDoubleClick(hitId, w);
    return;
  }

  if (e.button === 1 || tool === 'hand' || spaceHeld) {
    drag = { type: 'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
    return;
  }

  if (handle) {
    const h = handle.dataset.handle;
    if (h === 'resize') {
      const s = findShape(handle.dataset.shape);
      drag = { type: 'resize', id: s.id, dir: handle.dataset.dir, start: { x: s.x, y: s.y, w: s.w, h: s.h }, p0: w, before: snapshot() };
      return;
    }
    if (h === 'port' || h === 'quick') {
      drag = { type: 'connect', from: { shape: handle.dataset.shape, port: handle.dataset.port }, quick: h === 'quick', cur: w, sx: e.clientX, sy: e.clientY, moved: false };
      return;
    }
    if (h === 'end') {
      drag = { type: 'reconnect', id: handle.dataset.conn, end: handle.dataset.end, before: snapshot(), cur: w };
      return;
    }
  }

  if (hit) {
    const id = hit.dataset.id;
    const isConn = !!findConn(id);
    if (tool === 'line' && !isConn) {
      drag = { type: 'connect', from: { shape: id, port: null }, cur: w, sx: e.clientX, sy: e.clientY, moved: false };
      return;
    }
    let clickSelect = null;
    if (e.shiftKey || e.metaKey || e.ctrlKey) {
      if (selection.has(id)) { selection.delete(id); render(); return; }
      selection.add(id);
    } else if (!selection.has(id)) {
      selection = new Set([id]);
    } else if (selection.size > 1) {
      clickSelect = id;
    }
    render();
    if (isConn && !selectedShapes().length) { drag = { type: 'noop', clickSelect }; return; }
    startMove(w, e.altKey, clickSelect);
    return;
  }

  if (tool === 'text') {
    const before = snapshot();
    const s = addShape(createShape('text', w.x, w.y));
    selection = new Set([s.id]);
    commit(before);
    setTool('select');
    startEditing(s.id);
    return;
  }
  if (tool === 'line') {
    drag = { type: 'connect', from: { x: w.x, y: w.y }, cur: w, sx: e.clientX, sy: e.clientY, moved: false };
    return;
  }
  if (!e.shiftKey) selection.clear();
  drag = { type: 'marquee', p0: w, cur: w, base: new Set(selection), moved: false };
  render();
}

function nearestPort(s, w) {
  if (['legend', 'text'].includes(def(s).kind)) return null;
  let best = null, bd = 16 / view.z;
  for (const [side, p] of Object.entries(portsOf(s))) {
    const d = dist(p, w);
    if (d < bd) { bd = d; best = side; }
  }
  return best;
}

function handleMove(e) {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch) {
    if (pointers.size < 2) return;
    const [p1, p2] = [...pointers.values()];
    const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
    const r = canvasRect();
    const nz = clamp(pinch.view.z * (d / pinch.d), 0.1, 4);
    const sx = pinch.mid.x - r.left, sy = pinch.mid.y - r.top;
    const wx = (sx - pinch.view.x) / pinch.view.z, wy = (sy - pinch.view.y) / pinch.view.z;
    view.z = nz;
    view.x = sx - wx * nz + (mid.x - pinch.mid.x);
    view.y = sy - wy * nz + (mid.y - pinch.mid.y);
    render();
    return;
  }

  if (!drag) {
    if (e.pointerType !== 'mouse') return;
    let id = null;
    if (els.canvas.contains(e.target)) {
      const h = e.target.closest('[data-handle]');
      id = (h && h.dataset.shape) || (e.target.closest('#shapesLayer [data-id]') || {}).dataset?.id || null;
    }
    if (id !== hoverId) { hoverId = id; renderOverlay(); }
    return;
  }

  if (drag.type === 'lib') return libDragMove(e);
  const w = toWorld(e.clientX, e.clientY);

  switch (drag.type) {
    case 'pan':
      view.x = drag.vx + (e.clientX - drag.sx);
      view.y = drag.vy + (e.clientY - drag.sy);
      render();
      break;

    case 'move': {
      let dx = w.x - drag.p0.x, dy = w.y - drag.p0.y;
      if (!drag.moved && Math.hypot(dx * view.z, dy * view.z) < 3) return;
      drag.moved = true;
      if (e.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
      if (drag.bbox) {
        const bb = drag.bbox;
        const sn = smartSnap({ x: bb.x + dx, y: bb.y + dy, w: bb.w, h: bb.h }, drag.starts, e.metaKey || e.ctrlKey);
        if (!e.shiftKey || dx) dx = sn.x - bb.x;
        if (!e.shiftKey || dy) dy = sn.y - bb.y;
        drag.guides = sn.guides;
      }
      for (const [id, p] of drag.starts) { const s = findShape(id); if (s) { s.x = p.x + dx; s.y = p.y + dy; } }
      for (const f of drag.freeEnds) { f.c[f.end].x = f.x + dx; f.c[f.end].y = f.y + dy; }
      render();
      break;
    }

    case 'resize': {
      const s = findShape(drag.id);
      if (!s) return;
      const st = drag.start, dn = drag.dir;
      let dx = w.x - drag.p0.x, dy = w.y - drag.p0.y;
      let x = st.x, y = st.y, W = st.w, H = st.h;
      const snapOn = settings.snap && !(e.metaKey || e.ctrlKey);
      if (dn.includes('e')) { W = st.w + dx; if (snapOn) W = Math.round((st.x + W) / GRID) * GRID - st.x; }
      if (dn.includes('w')) { x = st.x + dx; if (snapOn) x = Math.round(x / GRID) * GRID; W = st.x + st.w - x; }
      if (dn.includes('s')) { H = st.h + dy; if (snapOn) H = Math.round((st.y + H) / GRID) * GRID - st.y; }
      if (dn.includes('n')) { y = st.y + dy; if (snapOn) y = Math.round(y / GRID) * GRID; H = st.y + st.h - y; }
      const minW = 20, minH = def(s).kind === 'bus' ? 6 : 16;
      if (e.shiftKey && dn.length === 2) {
        const ratio = st.w / st.h;
        if (W / st.w > H / st.h) H = W / ratio; else W = H * ratio;
        if (dn.includes('w')) x = st.x + st.w - W;
        if (dn.includes('n')) y = st.y + st.h - H;
      }
      if (W < minW) { if (dn.includes('w')) x = st.x + st.w - minW; W = minW; }
      if (H < minH) { if (dn.includes('n')) y = st.y + st.h - minH; H = minH; }
      Object.assign(s, { x, y, w: W, h: H });
      render();
      break;
    }

    case 'connect': {
      drag.cur = w;
      if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4) drag.moved = true;
      const t = shapeAt(w, drag.from.shape);
      drag.target = t ? t.id : null;
      drag.targetPort = t ? nearestPort(t, w) : null;
      render();
      break;
    }

    case 'reconnect': {
      const c = findConn(drag.id);
      if (!c) return;
      const other = c[drag.end === 'from' ? 'to' : 'from'];
      const t = shapeAt(w, other.shape);
      drag.target = t ? t.id : null;
      drag.targetPort = t ? nearestPort(t, w) : null;
      c[drag.end] = t ? { shape: t.id, port: drag.targetPort } : { x: w.x, y: w.y };
      render();
      break;
    }

    case 'marquee': {
      drag.cur = w;
      if (!drag.moved && Math.hypot((w.x - drag.p0.x) * view.z, (w.y - drag.p0.y) * view.z) > 3) drag.moved = true;
      if (!drag.moved) return;
      const l = Math.min(w.x, drag.p0.x), r = Math.max(w.x, drag.p0.x);
      const t = Math.min(w.y, drag.p0.y), b = Math.max(w.y, drag.p0.y);
      const inRect = (p) => p.x >= l && p.x <= r && p.y >= t && p.y <= b;
      const next = new Set(drag.base);
      for (const s of doc.shapes) if (s.x >= l && s.y >= t && s.x + s.w <= r && s.y + s.h <= b) next.add(s.id);
      for (const c of doc.connectors) {
        const geo = connGeometry(c);
        if (inRect(geo.a) && inRect(geo.b)) next.add(c.id);
      }
      selection = next;
      render();
      break;
    }
  }
}

function handleUp(e) {
  pointers.delete(e.pointerId);
  if (pinch) { if (pointers.size < 2) { pinch = null; autosave(); } return; }
  if (!drag) return;
  const d = drag;
  if (d.type === 'lib') return libDragEnd(e);
  drag = null;
  switch (d.type) {
    case 'pan': autosave(); break;
    case 'move':
      if (d.moved) commit(d.before);
      else if (d.alt) restore(d.before);
      else if (d.clickSelect) selection = new Set([d.clickSelect]);
      break;
    case 'noop':
      if (d.clickSelect) selection = new Set([d.clickSelect]);
      break;
    case 'resize': commit(d.before); break;
    case 'reconnect': commit(d.before); break;
    case 'connect': finishConnect(d); break;
  }
  render();
}

function finishConnect(d) {
  if (!d.moved) {
    if (d.quick) quickAdd(d.from.shape, d.from.port);
    return;
  }
  const before = snapshot();
  const c = { id: uid('c'), kind: settings.linkPreset, from: d.from, to: null, text: '', style: {} };
  if (d.target) {
    c.to = { shape: d.target, port: d.targetPort || null };
    doc.connectors.push(c);
    selection = new Set([c.id]);
    commit(before);
  } else {
    c.to = { x: d.cur.x, y: d.cur.y };
    if (!d.from.shape && dist(d.cur, d.from) < 10) return;
    doc.connectors.push(c);
    selection = new Set([c.id]);
    commit(before);
    if (d.from.shape) showQuickMenu(c.id, d.cur);
  }
}

function quickAdd(shapeId, port) {
  const src = findShape(shapeId);
  if (!src) return;
  const before = snapshot();
  const gap = 70;
  const [dx, dy] = DIR[port];
  const n = createShape(src.type, 0, 0, { w: src.w, h: src.h, style: src.style, tag: src.tag });
  n.x = dx > 0 ? src.x + src.w + gap : dx < 0 ? src.x - gap - src.w : src.x;
  n.y = dy > 0 ? src.y + src.h + gap : dy < 0 ? src.y - gap - src.h : src.y;
  const overlaps = (s) => doc.shapes.some((o) => def(o).kind !== 'container' && o.x < s.x + s.w && o.x + o.w > s.x && o.y < s.y + s.h && o.y + o.h > s.y);
  for (let i = 0; i < 6 && overlaps(n); i++) {
    if (dx) n.y += src.h + 30; else n.x += src.w + 30;
  }
  addShape(n);
  const opposite = { top: 'bottom', bottom: 'top', left: 'right', right: 'left' }[port];
  doc.connectors.push({ id: uid('c'), kind: settings.linkPreset, from: { shape: src.id, port }, to: { shape: n.id, port: opposite }, text: '', style: {} });
  selection = new Set([n.id]);
  commit(before);
}

/* quick shape picker after dropping a line on empty canvas */
let quickCtx = null;
function showQuickMenu(connId, at) {
  const c = findConn(connId);
  const src = c && findShape(c.from.shape);
  if (!src) return;
  const types = [...new Set([src.type, ...(def(src).group === 'system'
    ? ['subsystem', 'sensor', 'cpu', 'mcu', 'battery', 'motor', 'radio', 'software', 'storage']
    : ['process', 'decision', 'terminator', 'data', 'database', 'document', 'predefined', 'note', 'circle'])])].slice(0, 10);
  els.quick.innerHTML = `<div class="qm-grid">${types.map((t) => `<button class="lib-item" data-qtype="${t}" title="${SHAPES[t].name}">${libPreview(t)}</button>`).join('')}</div>
    <div class="qm-foot"><button data-qact="keep">Keep line</button><button data-qact="remove">Remove</button></div>`;
  const sp = toScreen(at);
  const r = canvasRect();
  els.quick.style.left = clamp(sp.x + 12, 8, r.width - 240) + 'px';
  els.quick.style.top = clamp(sp.y + 12, 8, r.height - 150) + 'px';
  els.quick.hidden = false;
  quickCtx = { connId, at, src };
}

function hideQuickMenu() {
  els.quick.hidden = true;
  quickCtx = null;
}

els.quick.addEventListener('pointerdown', (e) => e.stopPropagation());
els.quick.addEventListener('click', (e) => {
  if (!quickCtx) return;
  const btn = e.target.closest('button');
  if (!btn) return;
  const c = findConn(quickCtx.connId);
  if (btn.dataset.qact === 'remove' && c) {
    const before = snapshot();
    doc.connectors = doc.connectors.filter((x) => x !== c);
    selection.clear();
    commit(before);
  } else if (btn.dataset.qtype && c) {
    const before = snapshot();
    const type = btn.dataset.qtype;
    const same = type === quickCtx.src.type;
    const n = createShape(type, 0, 0, same ? { w: quickCtx.src.w, h: quickCtx.src.h, style: quickCtx.src.style, tag: quickCtx.src.tag } : {});
    const srcCenter = { x: quickCtx.src.x + quickCtx.src.w / 2, y: quickCtx.src.y + quickCtx.src.h / 2 };
    const side = facing(quickCtx.at, srcCenter);
    const at = quickCtx.at;
    if (side === 'left') { n.x = at.x; n.y = at.y - n.h / 2; }
    if (side === 'right') { n.x = at.x - n.w; n.y = at.y - n.h / 2; }
    if (side === 'top') { n.x = at.x - n.w / 2; n.y = at.y; }
    if (side === 'bottom') { n.x = at.x - n.w / 2; n.y = at.y - n.h; }
    n.x = snapV(n.x); n.y = snapV(n.y);
    addShape(n);
    c.to = { shape: n.id, port: null };
    selection = new Set([n.id]);
    commit(before);
  }
  hideQuickMenu();
});

/* ─── wheel / gestures ─── */
els.canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = canvasRect();
  if (e.ctrlKey || e.metaKey) {
    zoomAt(Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0105)), e.clientX - r.left, e.clientY - r.top);
  } else {
    const k = e.deltaMode === 1 ? 16 : 1;
    if (e.shiftKey && !e.deltaX) view.x -= e.deltaY * k;
    else { view.x -= e.deltaX * k; view.y -= e.deltaY * k; }
    render();
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(autosave, 600);
  }
}, { passive: false });

let gestureStart = null;
els.stage.addEventListener('gesturestart', (e) => { e.preventDefault(); gestureStart = view.z; });
els.stage.addEventListener('gesturechange', (e) => {
  e.preventDefault();
  if (gestureStart == null || pointers.size) return;
  const r = canvasRect();
  zoomAt((gestureStart * e.scale) / view.z, e.clientX - r.left, e.clientY - r.top);
});
els.stage.addEventListener('gestureend', (e) => { e.preventDefault(); gestureStart = null; });

els.canvas.addEventListener('pointerdown', handleDown);
window.addEventListener('pointermove', handleMove);
window.addEventListener('pointerup', handleUp);
window.addEventListener('pointercancel', handleUp);
els.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

let lastDown = null;
function handleDoubleClick(id, w) {
  if (id) { startEditing(id); return; }
  const before = snapshot();
  const s = addShape(createShape('text', w.x, w.y));
  selection = new Set([s.id]);
  commit(before);
  startEditing(s.id);
}

/* ─── inline text editing ─── */
function startEditing(id, initial) {
  const item = findAny(id);
  if (!item || (findShape(id) && def(item).kind === 'legend')) return;
  if (editing) finishEditing();
  editing = { id, before: snapshot() };
  selection = new Set([id]);
  const ed = els.editor;
  try { ed.contentEditable = 'plaintext-only'; } catch (err) { ed.contentEditable = 'true'; }
  if (ed.contentEditable !== 'plaintext-only') ed.contentEditable = 'true';
  ed.textContent = initial != null ? initial : item.text || '';
  ed.hidden = false;
  renderNow();
  ed.focus();
  const range = document.createRange();
  range.selectNodeContents(ed);
  if (initial != null) range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function positionEditor() {
  const ed = els.editor;
  const z = view.z;
  const s = findShape(editing.id);
  if (s) {
    const st = styleOf(s);
    const d = def(s);
    const box = textBoxOf(s);
    const pad = (d.kind === 'text' ? 4 : d.kind === 'container' ? 10 : 8);
    const fill = color(st.fill);
    const tl = toScreen({ x: s.x + box.x, y: s.y + box.y });
    ed.style.left = tl.x + 'px';
    ed.style.width = box.w * z + 'px';
    ed.style.padding = `0 ${pad * z}px`;
    ed.style.fontSize = st.fontSize * z + 'px';
    ed.style.fontWeight = st.bold || d.kind === 'bus' ? 600 : 400;
    ed.style.fontFamily = FONT_SANS;
    ed.style.textAlign = st.align;
    ed.style.color = st.textColor === 'auto' ? autoText(d.kind === 'container' ? 'none' : fill) : color(st.textColor);
    ed.style.background = d.kind === 'container' || fill === 'none' ? color('@canvas') : fill;
    const h = ed.offsetHeight;
    let top;
    if (st.valign === 'top') top = tl.y + pad * z;
    else if (st.valign === 'bottom') top = tl.y + box.h * z - pad * z - h;
    else top = tl.y + (box.h * z - h) / 2;
    ed.style.top = top + 'px';
  } else {
    const c = findConn(editing.id);
    const cc = c && connCache.get(c.id);
    if (!cc) return;
    const st = connStyle(c);
    const p = toScreen(cc.labelPos);
    ed.style.fontSize = st.fontSize * z + 'px';
    ed.style.fontWeight = 500;
    ed.style.fontFamily = FONT_SANS;
    ed.style.textAlign = 'center';
    ed.style.padding = `${2 * z}px ${6 * z}px`;
    ed.style.width = 'auto';
    ed.style.minWidth = 60 * z + 'px';
    ed.style.color = color(st.stroke) === 'none' ? color('@ink') : color(st.stroke);
    ed.style.background = color('@canvas');
    ed.style.left = p.x - ed.offsetWidth / 2 + 'px';
    ed.style.top = p.y - ed.offsetHeight / 2 + 'px';
  }
}

function finishEditing(cancel) {
  if (!editing) return;
  const { id, before } = editing;
  const item = findAny(id);
  const text = els.editor.innerText.replace(/\n$/, '');
  editing = null;
  els.editor.hidden = true;
  els.editor.blur();
  if (item && !cancel) {
    item.text = text;
    const s = findShape(id);
    if (s && def(s).kind === 'text') {
      const st = styleOf(s);
      const lines = wrapText(text || ' ', Math.max(8, s.w - 8), st.fontSize, st.bold);
      s.h = Math.max(s.h, Math.ceil(lines.length * st.fontSize * 1.25 + 10));
    }
  }
  panelKey = null;
  commit(before);
}

els.editor.addEventListener('input', () => { if (editing) positionEditor(); });
els.editor.addEventListener('keydown', (e) => {
  e.stopPropagation();
  if (e.key === 'Escape' || (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) || e.key === 'Tab') {
    e.preventDefault();
    finishEditing();
  }
});
els.editor.addEventListener('blur', () => { if (editing) finishEditing(); });
els.editor.addEventListener('paste', (e) => {
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, t);
});

/* ─── keyboard ─── */
window.addEventListener('keydown', (e) => {
  const tgt = e.target;
  const inField = tgt.closest && tgt.closest('input, textarea, select, [contenteditable="true"], [contenteditable="plaintext-only"]');
  const mod = e.metaKey || e.ctrlKey;
  const k = e.key.toLowerCase();

  if (inField) {
    if (e.key === 'Escape') tgt.blur();
    if (mod && k === 's') { e.preventDefault(); e.shiftKey ? saveAs() : save(); }
    return;
  }

  if (mod) {
    const map = {
      z: () => (e.shiftKey ? redo() : undo()), y: redo,
      s: () => (e.shiftKey ? saveAs() : save()), o: openFile, e: exportPNG,
      a: selectAll, d: duplicate, c: () => copySelection(false), x: () => copySelection(true), v: paste,
      '=': () => zoomCenter(1.2), '+': () => zoomCenter(1.2), '-': () => zoomCenter(1 / 1.2), '0': () => zoomTo(1),
      ']': () => reorder(e.shiftKey ? 'front' : 'forward'), '[': () => reorder(e.shiftKey ? 'back' : 'backward'),
      '}': () => reorder('front'), '{': () => reorder('back'),
    };
    if (map[k]) { e.preventDefault(); map[k](); }
    return;
  }

  switch (e.key) {
    case 'Backspace': case 'Delete':
      e.preventDefault(); deleteSelection(); return;
    case 'Escape':
      if (!els.quick.hidden) { hideQuickMenu(); return; }
      if (closeMenus()) return;
      if (drag && drag.before) { restore(drag.before); drag = null; return; }
      drag = null;
      selection.clear(); setTool('select'); render(); return;
    case 'Enter':
      if (selection.size === 1) { e.preventDefault(); startEditing([...selection][0]); }
      return;
    case 'ArrowLeft': case 'ArrowRight': case 'ArrowUp': case 'ArrowDown': {
      if (!selectedShapes().length) return;
      e.preventDefault();
      const n = e.shiftKey ? 10 : 1;
      nudge(e.key === 'ArrowLeft' ? -n : e.key === 'ArrowRight' ? n : 0, e.key === 'ArrowUp' ? -n : e.key === 'ArrowDown' ? n : 0);
      return;
    }
    case ' ':
      e.preventDefault();
      if (!spaceHeld) { spaceHeld = true; render(); }
      return;
    case '?':
      showShortcuts(); return;
  }
  if (e.code === 'Digit1' && e.shiftKey) { zoomFit(); return; }

  const single = selection.size === 1 ? findAny([...selection][0]) : null;
  if (single && e.key.length === 1 && !e.altKey && !(findShape(single.id) && def(single).kind === 'legend')) {
    e.preventDefault();
    startEditing(single.id, e.key);
    return;
  }
  const tools = { v: 'select', h: 'hand', t: 'text', l: 'line' };
  if (tools[k] && !e.shiftKey) setTool(tools[k]);
});

window.addEventListener('keyup', (e) => {
  if (e.key === ' ' && spaceHeld) { spaceHeld = false; render(); }
});
window.addEventListener('blur', () => { if (spaceHeld) { spaceHeld = false; render(); } });

/* ─── library ─── */
function libPreview(type) {
  const d = SHAPES[type];
  if (d.kind === 'block') {
    const c = CATS[d.cat].color;
    return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[d.icon]}"/></svg>`;
  }
  const w = 40, h = 40;
  const sw = 'vector-effect="non-scaling-stroke" stroke-width="1.4"';
  switch (d.kind) {
    case 'path': {
      const ratio = d.w / d.h;
      const pw = ratio >= 1 ? 36 : 36 * ratio, ph = ratio >= 1 ? 36 / ratio : 36;
      return `<svg viewBox="0 0 ${w} ${h}"><g transform="translate(${(w - pw) / 2} ${(h - ph) / 2})"><path d="${d.path(pw, ph)}" fill="var(--surface)" stroke="currentColor" ${sw} stroke-linejoin="round"/></g></svg>`;
    }
    case 'container':
      return type === 'panel'
        ? `<svg viewBox="0 0 40 40"><rect x="3" y="7" width="34" height="26" rx="3" fill="var(--active)"/><path d="M7 13h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`
        : `<svg viewBox="0 0 40 40"><rect x="3" y="7" width="34" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M7 13h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
    case 'text':
      return type === 'heading'
        ? `<svg viewBox="0 0 40 40"><text x="20" y="27" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="19" fill="currentColor">Aa</text></svg>`
        : `<svg viewBox="0 0 40 40"><text x="20" y="26" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="16" fill="currentColor">T</text></svg>`;
    case 'legend':
      return `<svg viewBox="0 0 40 40" fill="none" stroke-width="1.6"><rect x="4" y="6" width="32" height="28" rx="2" stroke="currentColor" stroke-width="1.2"/><path d="M9 15h10" stroke="#2563c9"/><path d="M9 21h10" stroke="#c43b2e"/><path d="M9 27h10" stroke="currentColor" stroke-dasharray="3 2"/><path d="M23 15h8M23 21h6M23 27h7" stroke="currentColor" stroke-width="1.2" opacity=".5"/></svg>`;
    case 'bus':
      return `<svg viewBox="0 0 24 24" fill="none" stroke="${CATS.data.color}" stroke-width="1.9" stroke-linecap="round"><path d="${ICONS.bus}"/></svg>`;
  }
  return '';
}

function buildLibrary(filter = '') {
  const q = filter.trim().toLowerCase();
  let html = '';
  let any = false;
  for (const sec of LIBRARY) {
    const types = sec.types.filter((t) => !q || SHAPES[t].name.toLowerCase().includes(q) || (SHAPES[t].cat || '').includes(q) || sec.title.toLowerCase().includes(q));
    if (!types.length) continue;
    any = true;
    const rows = sec.id === 'flow';
    html += `<details class="lib-sec" open><summary>${sec.title}</summary>`;
    if (rows) {
      html += `<div class="lib-grid">${types.map((t) => `<button class="lib-item" data-type="${t}" title="${SHAPES[t].name}">${libPreview(t)}</button>`).join('')}</div>`;
    } else {
      html += `<div class="lib-list">${types.map((t) => {
        const d = SHAPES[t];
        const c = d.cat ? CATS[d.cat].color : '#7A8C9E';
        return `<button class="lib-row" data-type="${t}" title="${d.name}"><span class="chip" style="background:${c}1f">${libPreview(t)}</span><span>${d.name}</span></button>`;
      }).join('')}</div>`;
    }
    html += `</details>`;
  }
  els.libBody.innerHTML = any ? html : `<div class="lib-empty">No shapes match “${filter.replace(/[<>&]/g, '')}”.</div>`;
}

els.libSearch.addEventListener('input', () => buildLibrary(els.libSearch.value));

els.libBody.addEventListener('pointerdown', (e) => {
  const item = e.target.closest('[data-type]');
  if (!item || e.button !== 0) return;
  e.preventDefault();
  drag = { type: 'lib', shape: item.dataset.type, sx: e.clientX, sy: e.clientY, moved: false, ghost: null };
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
});

function libDragMove(e) {
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4) {
    drag.moved = true;
    const d = SHAPES[drag.shape];
    const tmp = createShape(drag.shape, d.w / 2, d.h / 2);
    tmp.x = 0; tmp.y = 0;
    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    const svg = el('svg', { width: d.w * view.z + 4, height: d.h * view.z + 4 });
    const g = el('g', { transform: `translate(2 2) scale(${view.z})` }, svg);
    g.appendChild(buildShape(tmp, true));
    ghost.appendChild(svg);
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    document.body.classList.remove('show-lib');
  }
  if (drag.ghost) {
    drag.ghost.style.left = e.clientX + 'px';
    drag.ghost.style.top = e.clientY + 'px';
  }
}

function libDragEnd(e) {
  const d = drag;
  drag = null;
  if (d.ghost) d.ghost.remove();
  if (!d.moved) { addFromLibrary(d.shape); return; }
  const r = els.stage.getBoundingClientRect();
  if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
    addFromLibrary(d.shape, toWorld(e.clientX, e.clientY));
  } else render();
}

function swatchRow(list, current, act) {
  return `<div class="swatches">${list.map((c) => {
    if (c === 'none') return `<button class="sw none${current === 'none' ? ' is-on' : ''}" data-act="${act}" data-val="none" title="None"></button>`;
    if (c === 'auto') return `<button class="sw${current === 'auto' ? ' is-on' : ''}" data-act="${act}" data-val="auto" title="Automatic" style="background:var(--surface);font:600 9px var(--mono);color:var(--text-mid)">A</button>`;
    return `<button class="sw${current === c ? ' is-on' : ''}" data-act="${act}" data-val="${c}" title="${c[0] === '@' ? 'Ink' : c}" style="background:${color(c)}"></button>`;
  }).join('')}</div>`;
}

function colorInput(prop, current) {
  const v = color(current);
  const hex = /^#[0-9a-f]{6}$/i.test(v) ? v : '#ffffff';
  return `<input type="color" class="color-in" data-prop="${prop}" value="${hex}" title="Custom color">`;
}

function seg(act, options, current) {
  return `<div class="seg">${options.map(([val, label, title]) => `<button data-act="${act}" data-val="${val}" class="${String(current) === String(val) ? 'is-on' : ''}" title="${title || ''}">${label}</button>`).join('')}</div>`;
}

function linkSample(k) {
  const L = LINKS[k];

  return `<svg viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M2 5H${L.end === 'none' ? 98 : 90}" stroke="${stc}" stroke-width="${L.strokeWidth}" ${L.dash === 'dashed' ? 'stroke-dasharray="7 4"' : L.dash === 'dotted' ? 'stroke-dasharray="0.1 5" stroke-linecap="round"' : ''} vector-effect="non-scaling-stroke"/>${L.end === 'none' ? '' : `<path d="M98 5L88 1V9Z" fill="${stc}"/>`}</svg>`;
}

function applyStyle(prop, val) {
  const shapeProps = ['fill', 'textColor', 'fontSize', 'bold', 'align', 'valign'];
  for (const s of selectedShapes()) s.style[prop] = val;
  if (!shapeProps.includes(prop)) for (const c of selectedConns()) c.style[prop] = val;
}

els.props.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, val = b.dataset.val;
  const before = snapshot();
  const num = (v) => (isNaN(parseFloat(v)) ? v : parseFloat(v));
  switch (act) {
    case 'fill': case 'stroke': case 'textColor': case 'dash': case 'align': case 'valign': case 'route':
      applyStyle(act, val); break;
    case 'strokeWidth': applyStyle(act, num(val)); break;
    case 'bold': applyStyle('bold', val === 'true'); break;
    case 'z': reorder(val); return;
    case 'alignShapes': align(val); return;
    case 'distribute': distribute(val); return;
    case 'duplicate': duplicate(); return;
    case 'delete': deleteSelection(); return;
    case 'shortcuts': showShortcuts(); return;
    case 'defaultPreset':
      settings.linkPreset = val; saveSettings(); panelKey = null; render(); return;
    case 'preset':
      for (const c of selectedConns()) {
        c.kind = val;
        delete c.style.stroke; delete c.style.strokeWidth; delete c.style.dash; delete c.style.end;
      }
      settings.linkPreset = val; saveSettings();
      break;
    case 'swap':
      for (const c of selectedConns()) {
        [c.from, c.to] = [c.to, c.from];
      }
      break;
    default: return;
  }
  panelKey = null;
  commit(before);
});

let panelBefore = null;
els.props.addEventListener('focusin', (e) => {
  if (e.target.matches('input, textarea, select')) panelBefore = snapshot();
});
els.props.addEventListener('input', (e) => {
  const t = e.target;
  const prop = t.dataset.prop;
  if (!prop) return;
  if (panelBefore == null) panelBefore = snapshot();
  const v = t.value;
  const items = [...selectedShapes(), ...selectedConns()];
  if (prop === 'text') items.forEach((i) => { i.text = v; });
  else if (prop === 'tag') selectedShapes().forEach((s) => { s.tag = v; });
  else if (['x', 'y', 'w', 'h'].includes(prop)) {
    const n = parseFloat(v);
    if (!isNaN(n)) selectedShapes().forEach((s) => { s[prop] = ['w', 'h'].includes(prop) ? Math.max(6, n) : n; });
  } else if (prop === 'fontSize') {
    const n = parseFloat(v);
    if (!isNaN(n) && n >= 4) applyStyle('fontSize', clamp(n, 4, 200));
  } else if (prop === 'start' || prop === 'end') selectedConns().forEach((c) => { c.style[prop] = v; });
  else if (['fill', 'stroke'].includes(prop)) applyStyle(prop, v);
  render();
});
els.props.addEventListener('change', (e) => {
  if (panelBefore != null) {
    const b = panelBefore;
    panelBefore = null;
    if (e.target.matches('select, input[type=color]')) panelKey = null;
    commit(b);
  }
});
els.props.addEventListener('focusout', () => {
  if (panelBefore != null) { const b = panelBefore; panelBefore = null; commit(b); }
});
els.props.addEventListener('change', (e) => {
  const key = e.target.dataset.setting;
  if (!key) return;
  settings[key] = e.target.checked;
  saveSettings();
  render();
});
