<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Linework — a diagramming tool for flowcharts and system architecture, built by John Nohrden.">
<title>Linework — John Nohrden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      var t = localStorage.getItem('jn-theme');
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
<style>
/* ═══════════════════════════════════════════
   LINEWORK — styles (tokens shared with johnnohrden.com)
══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F4F0E4;
  --bg-alt: #EDE9D8;
  --surface: #FFFFFF;
  --text: #0A1F2E;
  --text-mid: #3D5166;
  --text-muted: #7A8C9E;
  --accent: #0A2540;
  --accent-hi: #3A82C4;
  --border: rgba(10, 37, 64, 0.10);
  --border-strong: rgba(10, 37, 64, 0.20);
  --hover: rgba(10, 37, 64, 0.06);
  --active: rgba(10, 37, 64, 0.11);
  --canvas: #FBF9F3;
  --grid-minor: rgba(10, 37, 64, 0.045);
  --grid-major: rgba(10, 37, 64, 0.095);
  --sel: #2F74C0;
  --sel-soft: rgba(47, 116, 192, 0.10);
  --shadow: 0 10px 30px rgba(10, 31, 46, 0.14), 0 1px 3px rgba(10, 31, 46, 0.10);
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'DM Sans', system-ui, -apple-system, sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --top-h: 52px;
  --lib-w: 244px;
  --props-w: 264px;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #060C17;
  --bg-alt: #0A1424;
  --surface: #0F2035;
  --text: #EDE9DF;
  --text-mid: #A8B8C8;
  --text-muted: #607080;
  --accent: #5AB0DC;
  --accent-hi: #80CBEE;
  --border: rgba(237, 233, 223, 0.08);
  --border-strong: rgba(237, 233, 223, 0.16);
  --hover: rgba(237, 233, 223, 0.06);
  --active: rgba(237, 233, 223, 0.12);
  --canvas: #081221;
  --grid-minor: rgba(90, 176, 220, 0.06);
  --grid-major: rgba(90, 176, 220, 0.13);
  --sel: #5AB0DC;
  --sel-soft: rgba(90, 176, 220, 0.12);
  --shadow: 0 12px 34px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  font-family: var(--sans);
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
svg { display: block; }

.app {
  height: 100%;
  display: grid;
  grid-template-rows: var(--top-h) 1fr;
  grid-template-columns: var(--lib-w) 1fr var(--props-w);
  grid-template-areas: "top top top" "lib stage props";
}

/* ─── Top bar ─── */
.topbar {
  grid-area: top;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px 0 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 30;
}
.brand {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 1.2rem;
  letter-spacing: 0.05em;
  color: var(--text);
  text-decoration: none;
}
.vsep { width: 1px; height: 22px; background: var(--border-strong); margin: 0 4px; }
.docname { display: flex; align-items: center; gap: 10px; min-width: 0; }
.app-label {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  color: var(--text-muted);
}
#docName {
  width: 190px;
  min-width: 60px;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 4px;
  padding: 5px 7px;
  font-weight: 500;
  font-size: 13.5px;
  text-overflow: ellipsis;
}
#docName:hover { border-color: var(--border-strong); }
#docName:focus { outline: none; border-color: var(--sel); background: var(--surface); }
.save-state {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  white-space: nowrap;
}
.spacer { flex: 1; }
.tb-group { display: flex; align-items: center; gap: 2px; }
.tb-btn {
  height: 32px;
  min-width: 32px;
  padding: 0 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-radius: 5px;
  color: var(--text-mid);
}
.tb-btn:hover { background: var(--hover); color: var(--text); }
.tb-btn.is-active { background: var(--active); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-strong); }
.tb-btn:disabled { opacity: 0.35; pointer-events: none; }
.tb-btn svg { width: 17px; height: 17px; }
.tb-text { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.04em; }
#zoomLabel { min-width: 54px; }
.btn-primary {
  height: 32px;
  padding: 0 14px;
  border-radius: 5px;
  background: var(--text);
  color: var(--bg);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.btn-primary:hover { background: var(--accent); color: var(--bg); }
[data-theme="dark"] .btn-primary:hover { color: #06101c; }
.theme-btn {
  width: 32px; height: 32px;
  border: 1px solid var(--border-strong);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
  flex-shrink: 0;
}
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }
[data-theme="light"] .icon-moon, :root:not([data-theme="dark"]) .icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: none; }

/* dropdown menus */
.menu-wrap { position: relative; }
.menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  min-width: 230px;
  padding: 6px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 7px;
  box-shadow: var(--shadow);
  z-index: 50;
}
.menu[hidden] { display: none; }
.menu button, .menu label {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 7px 10px;
  border-radius: 4px;
  text-align: left;
  color: var(--text);
  cursor: pointer;
}
.menu button:hover { background: var(--hover); }
.menu kbd { font-family: var(--mono); font-size: 10.5px; color: var(--text-muted); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 5px 4px; }
.menu .menu-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.14em;
  color: var(--text-muted);
  padding: 6px 10px 3px;
}

/* ─── Library (left) ─── */
.lib {
  grid-area: lib;
  background: var(--bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  z-index: 20;
}
.lib-search { padding: 12px 12px 8px; }
.field {
  width: 100%;
  height: 32px;
  padding: 0 10px;
  border: 1px solid var(--border-strong);
  border-radius: 5px;
  background: var(--surface);
}
.field:focus { outline: none; border-color: var(--sel); }
textarea.field { height: auto; min-height: 58px; padding: 7px 10px; resize: vertical; line-height: 1.4; }
.lib-body { overflow-y: auto; padding: 0 12px 24px; flex: 1; }
.lib-sec { margin-top: 10px; }
.lib-sec > summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 2px 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-muted);
  user-select: none;
}
.lib-sec > summary::-webkit-details-marker { display: none; }
.lib-sec > summary::after { content: '−'; font-size: 13px; }
.lib-sec:not([open]) > summary::after { content: '+'; }
.lib-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.lib-item {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
  cursor: grab;
  touch-action: none;
  color: var(--text-mid);
}
.lib-item:hover { background: var(--hover); }
.lib-item svg { width: 40px; height: 40px; overflow: visible; }
.lib-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.lib-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 6px;
  border-radius: 5px;
  cursor: grab;
  touch-action: none;
  font-size: 11.5px;
  line-height: 1.2;
  color: var(--text-mid);
  text-align: left;
  min-width: 0;
}
.lib-row:hover { background: var(--hover); color: var(--text); }
.lib-row .chip {
  width: 24px; height: 24px; flex-shrink: 0;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
}
.lib-row .chip svg { width: 15px; height: 15px; }
.lib-row span { overflow: hidden; text-overflow: ellipsis; }
.lib-empty { padding: 16px 4px; color: var(--text-muted); font-size: 12px; }
.drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 100;
  opacity: 0.85;
  transform: translate(-50%, -50%);
}

/* ─── Stage / canvas ─── */
.stage {
  grid-area: stage;
  position: relative;
  overflow: hidden;
  background: var(--canvas);
  touch-action: none;
}
#canvas { width: 100%; height: 100%; user-select: none; -webkit-user-select: none; }
#canvas.tool-hand, #canvas.panning { cursor: grab; }
#canvas.panning:active { cursor: grabbing; }
#canvas.tool-text { cursor: text; }
#canvas.tool-line { cursor: crosshair; }
.grid-minor { stroke: var(--grid-minor); }
.grid-major { stroke: var(--grid-major); }
.shape-hit { cursor: move; }
.conn-hit { cursor: pointer; }
.h-resize { fill: var(--surface); stroke: var(--sel); stroke-width: 1.5; }
.h-port { fill: var(--surface); stroke: var(--sel); stroke-width: 1.5; cursor: crosshair; }
.h-port:hover, .h-port.is-hot { fill: var(--sel); }
.h-quick { fill: var(--sel); cursor: pointer; opacity: 0.9; }
.h-quick:hover { opacity: 1; }
.h-end { fill: var(--surface); stroke: var(--sel); stroke-width: 2; cursor: move; }
.sel-box { fill: none; stroke: var(--sel); stroke-width: 1.25; pointer-events: none; }
.sel-group { fill: none; stroke: var(--sel); stroke-width: 1; stroke-dasharray: 4 3; pointer-events: none; }
.hover-box { fill: none; stroke: var(--sel); stroke-width: 1; opacity: 0.55; pointer-events: none; }
.target-box { fill: var(--sel-soft); stroke: var(--sel); stroke-width: 2; pointer-events: none; }
.marquee { fill: var(--sel-soft); stroke: var(--sel); stroke-width: 1; pointer-events: none; }
.guide { stroke: #e0435a; stroke-width: 1; pointer-events: none; }
.size-tip rect { fill: var(--sel); }
.size-tip text { fill: #fff; font-family: var(--mono); font-size: 10.5px; }

.text-editor {
  position: absolute;
  z-index: 15;
  outline: none;
  white-space: pre-wrap;
  word-break: break-word;
  overflow: visible;
  caret-color: var(--sel);
  line-height: 1.25;
  box-shadow: 0 0 0 1.5px var(--sel);
  border-radius: 2px;
  min-height: 1.25em;
}
.text-editor[hidden] { display: none; }

.empty-hint {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  max-width: 420px;
  padding: 0 24px;
}
.empty-hint[hidden] { display: none; }
.empty-hint .kick {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.2em;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.empty-hint h2 {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 30px;
  letter-spacing: -0.01em;
  margin-bottom: 12px;
}
.empty-hint p { color: var(--text-mid); font-size: 14px; line-height: 1.65; font-weight: 300; }
.empty-hint .hint-actions { margin-top: 20px; display: flex; gap: 8px; justify-content: center; pointer-events: auto; flex-wrap: wrap; }
.ghost-btn {
  white-space: nowrap;
  height: 32px;
  padding: 0 12px;
  border: 1px solid var(--border-strong);
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--text-mid);
  background: var(--canvas);
}
.ghost-btn:hover { border-color: var(--text); color: var(--text); }

.quick-menu {
  position: absolute;
  z-index: 25;
  width: 232px;
  padding: 8px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  box-shadow: var(--shadow);
}
.quick-menu[hidden] { display: none; }
.quick-menu .qm-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.quick-menu .lib-item svg { width: 30px; height: 30px; }
.quick-menu .qm-foot { display: flex; justify-content: space-between; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
.quick-menu .qm-foot button { font-size: 11.5px; color: var(--text-mid); padding: 4px 6px; border-radius: 4px; }
.quick-menu .qm-foot button:hover { background: var(--hover); color: var(--text); }

.zoom-float {
  position: absolute;
  right: 12px;
  bottom: 12px;
  display: none;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 7px;
  box-shadow: var(--shadow);
  padding: 2px;
}
.toast {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%) translateY(10px);
  background: var(--text);
  color: var(--bg);
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 12.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s, transform .18s;
  z-index: 40;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.drop-veil {
  position: absolute; inset: 10px;
  border: 2px dashed var(--sel);
  border-radius: 10px;
  background: var(--sel-soft);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); letter-spacing: .1em; font-size: 12px; color: var(--sel);
  pointer-events: none;
  z-index: 45;
}
.drop-veil[hidden] { display: none; }

/* ─── Properties (right) ─── */
.props {
  grid-area: props;
  background: var(--bg);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  z-index: 20;
  padding-bottom: 32px;
}
.p-head {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.p-title { font-family: var(--serif); font-size: 17px; font-weight: 600; }
.p-count { font-family: var(--mono); font-size: 10.5px; color: var(--text-muted); letter-spacing: 0.08em; }
.p-sec { padding: 12px 16px 14px; border-bottom: 1px solid var(--border); }
.p-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.p-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.p-row:first-of-type { margin-top: 0; }
.p-row > .grow { flex: 1; min-width: 0; }
.p-sub { font-size: 11.5px; color: var(--text-mid); width: 44px; flex-shrink: 0; }
.swatches { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.sw {
  aspect-ratio: 1;
  border-radius: 3px;
  box-shadow: inset 0 0 0 1px var(--border-strong);
  position: relative;
}
.sw.is-on { box-shadow: 0 0 0 2px var(--sel); }
.sw.none { background: linear-gradient(135deg, transparent 45%, #d24a3a 45%, #d24a3a 55%, transparent 55%), var(--surface); }
.color-in {
  width: 28px; height: 28px; padding: 0; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--surface); cursor: pointer;
}
.color-in::-webkit-color-swatch-wrapper { padding: 3px; }
.color-in::-webkit-color-swatch { border: 0; border-radius: 3px; }
.seg {
  display: flex;
  border: 1px solid var(--border-strong);
  border-radius: 5px;
  overflow: hidden;
  flex: 1;
}
.seg button {
  flex: 1;
  height: 28px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-mid);
  border-right: 1px solid var(--border);
  font-size: 11.5px;
}
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--hover); }
.seg button.is-on { background: var(--active); color: var(--text); font-weight: 500; }
.seg svg { width: 16px; height: 16px; }
select.field { padding: 0 6px; }
.num {
  width: 100%;
  height: 28px;
  border: 1px solid var(--border-strong);
  border-radius: 5px;
  background: var(--surface);
  padding: 0 6px;
  font-family: var(--mono);
  font-size: 11.5px;
}
.num:focus { outline: none; border-color: var(--sel); }
.xywh { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.xywh label { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10px; color: var(--text-muted); }
.link-presets { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.lp {
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 8px 8px 7px;
  border: 1px solid var(--border);
  border-radius: 5px;
  text-align: left;
  font-size: 11.5px;
  color: var(--text-mid);
}
.lp:hover { border-color: var(--border-strong); color: var(--text); }
.lp.is-on { border-color: var(--sel); color: var(--text); box-shadow: inset 0 0 0 1px var(--sel); }
.lp svg { width: 100%; height: 10px; }
.icon-btns { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.icon-btns button {
  height: 30px; border-radius: 5px; color: var(--text-mid);
  display: flex; align-items: center; justify-content: center;
}
.icon-btns button:hover { background: var(--hover); color: var(--text); }
.icon-btns svg { width: 17px; height: 17px; }
.wide-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.wide-btns button {
  height: 30px; border: 1px solid var(--border); border-radius: 5px; color: var(--text-mid); font-size: 11.5px;
}
.wide-btns button:hover { border-color: var(--border-strong); color: var(--text); }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; cursor: pointer; font-size: 12.5px; color: var(--text-mid); }
.toggle input { accent-color: var(--sel); width: 15px; height: 15px; }
.keys { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 12px; color: var(--text-mid); }
.keys kbd {
  font-family: var(--mono); font-size: 10.5px; color: var(--text);
  border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; white-space: nowrap; justify-self: end;
}
.p-note { font-size: 12px; color: var(--text-mid); line-height: 1.55; font-weight: 300; }
.p-note b { font-weight: 500; color: var(--text); }

/* ─── Mobile / narrow ─── */
.only-narrow { display: none !important; }
@media (max-width: 1080px) {
  :root { --props-w: 236px; --lib-w: 220px; }
  .app-label, .save-state { display: none; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-areas: "top" "stage"; }
  .lib, .props {
    position: fixed;
    top: var(--top-h);
    bottom: 0;
    width: min(300px, 86vw);
    box-shadow: var(--shadow);
    transition: transform .22s ease;
  }
  .lib { left: 0; transform: translateX(-102%); }
  .props { right: 0; transform: translateX(102%); }
  body.show-lib .lib, body.show-props .props { transform: none; }
  .only-narrow { display: inline-flex !important; }
  .hide-narrow { display: none !important; }
  #docName { width: 120px; }
  .topbar { gap: 4px; padding: 0 8px 0 12px; }
}
@media (max-width: 520px) {
  .hide-phone { display: none !important; }
  #docName { width: 90px; }
  .empty-hint h2 { font-size: 24px; }
}

</style>
</head>
<body>
<div class="app">

  <!-- ═══════════ TOP BAR ═══════════ -->
  <header class="topbar">
    <a class="brand" href="index.html" title="Back to johnnohrden.com">JN</a>
    <span class="vsep hide-phone"></span>
    <button class="tb-btn only-narrow" id="libToggle" title="Shapes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
    </button>
    <div class="docname">
      <span class="app-label">LINEWORK</span>
      <input id="docName" value="Untitled diagram" spellcheck="false" aria-label="Diagram name">
      <span class="save-state" id="saveState"></span>
    </div>
    <span class="vsep hide-narrow"></span>
    <div class="tb-group" id="tools">
      <button class="tb-btn is-active" data-tool="select" title="Select (V)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5.5 3.5l13 7.2-5.8 1.6-2.4 5.9z"/></svg>
      </button>
      <button class="tb-btn hide-phone" data-tool="hand" title="Hand — pan the canvas (H, or hold Space)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11.5V5.5a1.5 1.5 0 0 1 3 0V10M11 10V4a1.5 1.5 0 0 1 3 0v6M14 10V5.5a1.5 1.5 0 0 1 3 0V13c0 4-2.7 7-6.5 7-2.6 0-4.1-1.3-5.3-3.4L3.4 13a1.5 1.5 0 0 1 2.5-1.6L8 13.8"/></svg>
      </button>
      <button class="tb-btn" data-tool="text" title="Text (T)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5.5h14M12 5.5V19M9 19h6"/></svg>
      </button>
      <button class="tb-btn" data-tool="line" title="Line — drag between shapes (L)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L18.5 5.5M13 5h6v6"/></svg>
      </button>
    </div>
    <span class="vsep hide-narrow"></span>
    <div class="tb-group">
      <button class="tb-btn" id="undoBtn" title="Undo (⌘Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button class="tb-btn hide-phone" id="redoBtn" title="Redo (⇧⌘Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
    </div>
    <div class="spacer"></div>
    <div class="tb-group hide-narrow">
      <button class="tb-btn" id="zoomOut" title="Zoom out (⌘−)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 12h12"/></svg>
      </button>
      <button class="tb-btn tb-text" id="zoomLabel" title="Reset to 100% (⌘0)">100%</button>
      <button class="tb-btn" id="zoomIn" title="Zoom in (⌘+)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
      </button>
      <button class="tb-btn" id="zoomFit" title="Zoom to fit (⇧1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
    <span class="vsep hide-narrow"></span>
    <div class="menu-wrap">
      <button class="tb-btn tb-text" id="fileBtn" aria-haspopup="true">FILE</button>
      <div class="menu" id="fileMenu" hidden>
        <button data-cmd="new">New diagram</button>
        <div class="menu-label">START FROM</div>
        <button data-cmd="tpl-system">System architecture</button>
        <button data-cmd="tpl-flow">Flowchart</button>
        <hr>
        <button data-cmd="open">Open… <kbd>⌘O</kbd></button>
        <button data-cmd="save">Save <kbd>⌘S</kbd></button>
        <button data-cmd="saveAs">Save as… <kbd>⇧⌘S</kbd></button>
        <hr>
        <button data-cmd="exportPNG">Export PNG <kbd>⌘E</kbd></button>
        <button data-cmd="exportSVG">Export SVG</button>
        <button data-cmd="copyPNG">Copy as image</button>
        <hr>
        <button data-cmd="shortcuts">Keyboard shortcuts <kbd>?</kbd></button>
      </div>
    </div>
    <button class="btn-primary hide-phone" id="exportBtn" title="Export PNG (⌘E)">Export</button>
    <button class="tb-btn only-narrow" id="propsToggle" title="Properties">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4"/></svg>
    </button>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">
      <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <!-- ═══════════ SHAPE LIBRARY ═══════════ -->
  <aside class="lib" id="lib">
    <div class="lib-search"><input class="field" id="libSearch" placeholder="Search shapes" spellcheck="false"></div>
    <div class="lib-body" id="libBody"></div>
  </aside>

  <!-- ═══════════ CANVAS ═══════════ -->
  <main class="stage" id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gridMinor" patternUnits="userSpaceOnUse" width="10" height="10">
          <path class="grid-minor" d="M10 0H0V10" fill="none" stroke-width="1"/>
        </pattern>
        <pattern id="gridMajor" patternUnits="userSpaceOnUse" width="50" height="50">
          <rect width="50" height="50" fill="url(#gridMinor)"/>
          <path class="grid-major" d="M50 0H0V50" fill="none" stroke-width="1"/>
        </pattern>
      </defs>
      <rect id="gridRect" x="0" y="0" width="100%" height="100%" fill="url(#gridMajor)"/>
      <g id="viewport">
        <g id="shapesLayer"></g>
        <g id="connLayer"></g>
        <g id="previewLayer"></g>
      </g>
      <g id="overlay"></g>
    </svg>
    <div class="text-editor" id="textEditor" hidden spellcheck="false"></div>
    <div class="quick-menu" id="quickMenu" hidden></div>
    <div class="empty-hint" id="emptyHint">
      <div class="kick">LINEWORK / DIAGRAMS</div>
      <h2>Draw how it works.</h2>
      <p>Drag shapes in from the library. Hover any shape and pull from a dot to connect it. Everything saves in this browser as you go.</p>
      <div class="hint-actions">
        <button class="ghost-btn" data-cmd="tpl-system">SYSTEM TEMPLATE</button>
        <button class="ghost-btn" data-cmd="tpl-flow">FLOWCHART TEMPLATE</button>
      </div>
    </div>
    <div class="drop-veil" id="dropVeil" hidden>DROP A .LINEWORK FILE TO OPEN</div>
    <div class="toast" id="toast"></div>
  </main>

  <!-- ═══════════ PROPERTIES ═══════════ -->
  <aside class="props" id="props"></aside>
</div>

<input type="file" id="fileInput" accept=".linework,.json,application/json" hidden>

<script>
/* ═══════════════════════════════════════════
   LINEWORK — shape, icon and link definitions
══════════════════════════════════════════ */

const ICONS = {
  sensor:   'M12 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0M8.2 8.2a5.5 5.5 0 0 0 0 7.6M15.8 8.2a5.5 5.5 0 0 1 0 7.6M5.3 5.3a9.5 9.5 0 0 0 0 13.4M18.7 5.3a9.5 9.5 0 0 1 0 13.4',
  camera:   'M3 8h4l2-3h6l2 3h4v11H3zM12 13.5m-3.5 0a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0',
  gps:      'M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21zM12 9.5m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0',
  imu:      'M12 13V3.5M12 13l8 4.5M12 13l-8 4.5M9.5 6L12 3.5 14.5 6M17 18.8l3-1.3-.6-3.1M4.6 14.4L4 17.5l3 1.3',
  lidar:    'M3 12h3M12 12m-1.6 0a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0-3.2 0M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9.2 9.2 0 0 1 0 13',
  cpu:      'M7 7h10v10H7zM10 10h4v4h-4zM9.5 3v4M14.5 3v4M9.5 17v4M14.5 17v4M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4',
  mcu:      'M7 4h10v16H7zM4 8h3M4 12h3M4 16h3M17 8h3M17 12h3M17 16h3M10 7.5h1.5',
  gpu:      'M2.5 7h19v10h-19zM6 10h5v4H6zM14 10.5h4M14 13.5h4M6 17v3M18 17v3',
  battery:  'M3 8h15v9H3zM18 11h2.5v3H18zM6 12.5h5M8.5 10v5',
  power:    'M13 2.5L5 13.5h6l-1 8 8-11h-6z',
  solar:    'M3.5 18.5L6.5 8h11l3 10.5zM9.8 8l-1.3 10.5M14.2 8l1.3 10.5M5 13.2h14',
  motor:    'M12 12m-6.5 0a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M12 12m-1.8 0a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0-3.6 0M12 5.5V2.5M12 21.5v-3',
  actuator: 'M3 9h10v6H3zM13 12h7M17.5 9l3 3-3 3',
  thruster: 'M12 12m-1.6 0a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0-3.2 0M12 10.4C10.8 7 10.8 4 12 2.8c1.2 1.2 1.2 4.2 0 7.6M13.4 12.8c3.1 1.8 5.3 4.2 5.4 5.6-1.4.5-4.3-1.3-6.6-4.3M10.6 12.8c-3.1 1.8-5.3 4.2-5.4 5.6 1.4.5 4.3-1.3 6.6-4.3',
  radio:    'M4 10h16v10H4zM8.5 15m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0M13.5 13.5h3.5M13.5 16.5h3.5M7 10l9-6',
  antenna:  'M12 10v11M8 21h8M12 10L6.5 2.5h11zM4 6.5a8 8 0 0 0 0 7M20 6.5a8 8 0 0 1 0 7',
  wireless: 'M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01',
  storage:  'M5 6c0-1.7 3.1-3 7-3s7 1.3 7 3-3.1 3-7 3-7-1.3-7-3zM5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3',
  code:     'M8 7.5L3.5 12 8 16.5M16 7.5l4.5 4.5-4.5 4.5M13.5 5l-3 14',
  cloud:    'M7 18.5h10.5a4.2 4.2 0 0 0 .6-8.4A6.2 6.2 0 0 0 6.2 9.7 4.4 4.4 0 0 0 7 18.5z',
  user:     'M12 8m-4 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0M4 21c.9-4.4 4.3-6.2 8-6.2s7.1 1.8 8 6.2',
  display:  'M3 4h18v12H3zM8 20.5h8M12 16v4.5',
  module:   'M3.5 7.5L12 3l8.5 4.5L12 12zM3.5 7.5v9L12 21l8.5-4.5v-9M12 12v9',
  bus:      'M2.5 12h19M6 12V7M12 12V7M18 12V7M6 12v5M12 12v5M18 12v5',
};

const CATS = {
  sensing:   { name: 'Sensing',   color: '#0f8f8a' },
  compute:   { name: 'Compute',   color: '#4f55c9' },
  power:     { name: 'Power',     color: '#c7771a' },
  actuation: { name: 'Actuation', color: '#c23b4a' },
  comms:     { name: 'Comms',     color: '#8757c7' },
  data:      { name: 'Data',      color: '#50657a' },
  software:  { name: 'Software',  color: '#2f8a4c' },
  external:  { name: 'External',  color: '#6b7a89' },
};

/* Link presets. Colors starting with @ resolve per theme. */
const LINKS = {
  generic:    { name: 'Generic',    stroke: '@ink',     strokeWidth: 1.5, dash: 'solid',  end: 'arrow' },
  data:       { name: 'Data',       stroke: '@data',    strokeWidth: 2,   dash: 'solid',  end: 'arrow' },
  power:      { name: 'Power',      stroke: '@power',   strokeWidth: 2.5, dash: 'solid',  end: 'arrow' },
  control:    { name: 'Control',    stroke: '@control', strokeWidth: 1.5, dash: 'dashed', end: 'arrow' },
  signal:     { name: 'RF / Wireless', stroke: '@signal', strokeWidth: 1.75, dash: 'dotted', end: 'arrow' },
  mechanical: { name: 'Mechanical', stroke: '@mech',    strokeWidth: 3,   dash: 'solid',  end: 'none' },
};

const THEME_COLORS = {
  light: { '@ink': '#0A1F2E', '@data': '#2563c9', '@power': '#c43b2e', '@control': '#3D5166', '@signal': '#8a4fd1', '@mech': '#7b7064', '@canvas': '#FBF9F3', '@paper': '#FFFFFF' },
  dark:  { '@ink': '#EDE9DF', '@data': '#5AB0DC', '@power': '#f07a6a', '@control': '#A8B8C8', '@signal': '#b89af0', '@mech': '#b5a898', '@canvas': '#081221', '@paper': '#0F2035' },
};

const FILL_SWATCHES = ['#FFFFFF', '#F4F0E4', '#E6ECF2', '#FDE3DF', '#FCEBD5', '#FBF3C8', '#DDF0E2', '#D8EFF0', '#DCE7F7', '#E6E1F7', '#F4DFEA', 'none'];
const INK_SWATCHES = ['@ink', '#3D5166', '#7A8C9E', '#c43b2e', '#c7771a', '#b39512', '#2f8a4c', '#0f8f8a', '#2563c9', '#4f55c9', '#8757c7', '#c23b7a'];

/* ─── geometry helpers ─── */
const rrect = (w, h, r) => {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  return `M${r} 0H${w - r}A${r} ${r} 0 0 1 ${w} ${r}V${h - r}A${r} ${r} 0 0 1 ${w - r} ${h}H${r}A${r} ${r} 0 0 1 0 ${h - r}V${r}A${r} ${r} 0 0 1 ${r} 0Z`;
};
const ellipse = (w, h) => `M0 ${h / 2}A${w / 2} ${h / 2} 0 1 0 ${w} ${h / 2}A${w / 2} ${h / 2} 0 1 0 0 ${h / 2}Z`;

const BASE_STYLE = {
  fill: '#FFFFFF', stroke: '@ink', strokeWidth: 1.5, dash: 'solid',
  textColor: 'auto', fontSize: 14, bold: false, align: 'center', valign: 'middle',
};

/*
  kind: path | block | container | text | bus | legend
  path(w,h)     → SVG path in local coords
  textBox(w,h)  → {x,y,w,h} area for label
  ports(w,h)    → {top,right,bottom,left} as [x,y]
*/
const SHAPES = {
  /* ── Flowchart ── */
  process: { group: 'flow', name: 'Process', w: 150, h: 72, text: 'Process', kind: 'path', path: (w, h) => rrect(w, h, 3) },
  rounded: { group: 'flow', name: 'Alternate process', w: 150, h: 72, text: 'Step', kind: 'path', path: (w, h) => rrect(w, h, 14) },
  decision: {
    group: 'flow', name: 'Decision', w: 150, h: 100, text: 'Decision?', kind: 'path',
    style: { fill: '#FCEBD5', stroke: '#b86a12' },
    path: (w, h) => `M${w / 2} 0L${w} ${h / 2}L${w / 2} ${h}L0 ${h / 2}Z`,
    textBox: (w, h) => ({ x: w * 0.2, y: h * 0.22, w: w * 0.6, h: h * 0.56 }),
  },
  terminator: {
    group: 'flow', name: 'Start / End', w: 150, h: 60, text: 'Start', kind: 'path',
    style: { fill: '#E6ECF2', stroke: '#1A4A7A' },
    path: (w, h) => rrect(w, h, h / 2),
    textBox: (w, h) => ({ x: h * 0.3, y: 0, w: w - h * 0.6, h }),
  },
  data: {
    group: 'flow', name: 'Data (I/O)', w: 160, h: 72, text: 'Input', kind: 'path',
    style: { fill: '#D8EFF0', stroke: '#0f7a76' },
    path: (w, h) => { const s = Math.min(w * 0.18, h * 0.5); return `M${s} 0H${w}L${w - s} ${h}H0Z`; },
    textBox: (w, h) => { const s = Math.min(w * 0.18, h * 0.5); return { x: s, y: 0, w: w - 2 * s, h }; },
    ports: (w, h) => { const s = Math.min(w * 0.18, h * 0.5); return { top: [w / 2 + s / 2, 0], right: [w - s / 2, h / 2], bottom: [w / 2 - s / 2, h], left: [s / 2, h / 2] }; },
  },
  document: {
    group: 'flow', name: 'Document', w: 150, h: 84, text: 'Document', kind: 'path',
    path: (w, h) => `M0 0H${w}V${h * 0.84}C${w * 0.72} ${h * 0.64} ${w * 0.36} ${h * 1.08} 0 ${h * 0.9}Z`,
    textBox: (w, h) => ({ x: 0, y: 0, w, h: h * 0.84 }),
    ports: (w, h) => ({ top: [w / 2, 0], right: [w, h * 0.42], bottom: [w / 2, h * 0.88], left: [0, h * 0.45] }),
  },
  predefined: {
    group: 'flow', name: 'Subroutine', w: 160, h: 72, text: 'Subroutine', kind: 'path',
    path: (w, h) => { const i = Math.min(14, w * 0.1); return `${rrect(w, h, 2)}M${i} 0V${h}M${w - i} 0V${h}`; },
    textBox: (w, h) => { const i = Math.min(14, w * 0.1); return { x: i, y: 0, w: w - 2 * i, h }; },
  },
  database: {
    group: 'flow', name: 'Database', w: 120, h: 100, text: 'Database', kind: 'path',
    style: { fill: '#DDF0E2', stroke: '#2f7a46' },
    path: (w, h) => { const r = Math.min(h * 0.16, 16); return `M0 ${r}A${w / 2} ${r} 0 0 1 ${w} ${r}V${h - r}A${w / 2} ${r} 0 0 1 0 ${h - r}ZM0 ${r}A${w / 2} ${r} 0 0 0 ${w} ${r}`; },
    textBox: (w, h) => { const r = Math.min(h * 0.16, 16); return { x: 0, y: r * 2, w, h: h - r * 3 }; },
  },
  manualInput: {
    group: 'flow', name: 'Manual input', w: 150, h: 80, text: 'Manual input', kind: 'path',
    path: (w, h) => `M0 ${h * 0.3}L${w} 0V${h}H0Z`,
    textBox: (w, h) => ({ x: 0, y: h * 0.3, w, h: h * 0.7 }),
    ports: (w, h) => ({ top: [w / 2, h * 0.15], right: [w, h / 2], bottom: [w / 2, h], left: [0, h * 0.65] }),
  },
  preparation: {
    group: 'flow', name: 'Preparation', w: 160, h: 72, text: 'Prepare', kind: 'path',
    path: (w, h) => { const s = Math.min(w * 0.18, h * 0.5); return `M${s} 0H${w - s}L${w} ${h / 2}L${w - s} ${h}H${s}L0 ${h / 2}Z`; },
    textBox: (w, h) => { const s = Math.min(w * 0.18, h * 0.5); return { x: s, y: 0, w: w - 2 * s, h }; },
  },
  delay: {
    group: 'flow', name: 'Delay', w: 140, h: 72, text: 'Wait', kind: 'path',
    path: (w, h) => { const r = Math.min(h / 2, w / 2); return `M0 0H${w - r}A${r} ${r} 0 0 1 ${w - r} ${h}H0Z`; },
  },
  offpage: {
    group: 'flow', name: 'Off-page link', w: 80, h: 80, text: 'A', kind: 'path',
    path: (w, h) => `M0 0H${w}V${h * 0.62}L${w / 2} ${h}L0 ${h * 0.62}Z`,
    textBox: (w, h) => ({ x: 0, y: 0, w, h: h * 0.62 }),
  },
  circle: { group: 'flow', name: 'Connector', w: 64, h: 64, text: '1', kind: 'path', path: ellipse },
  ellipse: { group: 'flow', name: 'Ellipse', w: 150, h: 84, text: '', kind: 'path', path: ellipse },

  /* ── System blocks ── */
  sensor:    { group: 'system', cat: 'sensing',   icon: 'sensor',   name: 'Sensor',        text: 'Sensor' },
  camera:    { group: 'system', cat: 'sensing',   icon: 'camera',   name: 'Camera',        text: 'Camera' },
  gps:       { group: 'system', cat: 'sensing',   icon: 'gps',      name: 'GPS / GNSS',    text: 'GNSS receiver' },
  imu:       { group: 'system', cat: 'sensing',   icon: 'imu',      name: 'IMU',           text: 'IMU' },
  lidar:     { group: 'system', cat: 'sensing',   icon: 'lidar',    name: 'LiDAR / Sonar', text: 'LiDAR' },
