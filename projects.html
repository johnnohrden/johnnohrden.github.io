<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Projects by John Nohrden — engineering, software, and robotics work.">
  <title>Projects — John Nohrden</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=5">

  <!-- Restore theme before first paint to avoid a flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('jn-theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>

  <style>
    /* ═══════════════════════════════════════════
       PROJECTS PAGE — page-specific styles
    ══════════════════════════════════════════ */
    .hero-name { font-size: clamp(2.5rem, 7vw, 5rem); }

    .proj-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      align-items: start;
    }

    .proj-card {
      display: flex;
      flex-direction: column;
      padding: 32px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .proj-card-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .proj-index,
    .proj-year {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    .proj-title {
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 12px;
    }

    .proj-desc {
      font-size: 0.9375rem;
      font-weight: 300;
      line-height: 1.65;
      color: var(--text-mid);
      margin-bottom: 24px;
    }

    .proj-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
      margin-bottom: 20px;
    }

    .proj-tag {
      font-family: var(--mono);
      font-size: 0.6875rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 5px 10px;
    }

    .proj-links {
      display: flex;
      gap: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .proj-link {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-mid);
    }

    .proj-link:hover { color: var(--accent); }

    /* ─── Empty state ─── */
    .proj-empty {
      padding: clamp(48px, 7vw, 80px) clamp(24px, 4vw, 48px);
      border: 1px dashed var(--border-strong);
      text-align: center;
    }

    .proj-empty-title {
      font-family: var(--serif);
      font-size: clamp(1.375rem, 3vw, 1.875rem);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 14px;
    }

    .proj-empty-body {
      max-width: 44ch;
      margin: 0 auto 24px;
      font-size: 0.9375rem;
      font-weight: 300;
      line-height: 1.7;
      color: var(--text-mid);
    }

    .proj-empty-cta,
    .back-link {
      font-family: var(--mono);
      font-size: 0.8125rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .proj-empty-cta:hover,
    .back-link:hover { color: var(--accent); }

    .page-back {
      max-width: var(--max-w);
      margin: clamp(48px, 6vw, 80px) auto 0;
    }

    @media (max-width: 640px) {
      .proj-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="nav" id="nav">
    <a href="index.html" class="nav-logo">JN</a>
    <div class="nav-links">
      <a href="index.html#about" class="nav-link">About</a>
      <a href="index.html#experience" class="nav-link">Experience</a>
      <a href="index.html#education" class="nav-link">Education</a>
      <a href="projects.html" class="nav-link is-current">Projects</a>
      <a href="index.html#contact" class="nav-link">Contact</a>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </nav>

  <!-- ═══════════════ PAGE HEAD ═══════════════ -->
  <header class="hero">
    <div class="hero-body">
      <h1 class="hero-name">
        <span class="name-row">PROJECTS</span>
      </h1>
    </div>
  </header>

  <!-- ═══════════════ PROJECTS ═══════════════ -->
  <section class="section" id="projects">
    <div class="container">
      <!-- Rendered from the PROJECTS array in the script below.
           Empty array → the empty state appears automatically. -->
      <div class="proj-grid" id="projGrid" hidden></div>

      <div class="proj-empty" id="projEmpty" hidden>
        <h2 class="proj-empty-title">Nothing published yet.</h2>
        <p class="proj-empty-body">
          This page is where the build logs go. Check back soon, or reach out
          if you want to hear what I'm working on.
        </p>
        <a href="index.html#contact" class="proj-empty-cta">Get in touch</a>
      </div>

      <div class="page-back">
        <a href="index.html" class="back-link">← Back to home</a>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <span class="mono small">© 2026 John Nohrden</span>
    <span class="mono small">Dover, MA</span>
  </footer>

  <script>
  /* ═══════════════════════════════════════════════════════════
     PROJECTS DATA
     ───────────────────────────────────────────────────────────
     To add a project, drop an object into this array. Layout and
     numbering happen automatically. The empty state disappears
     as soon as there is one entry.

     {
       title: 'Project name',
       year:  '2026',
       desc:  'One or two sentences on what it is and what you did.',
       tags:  ['Arduino', 'CAD'],
       links: [
         { label: 'Live',   href: 'https://…' },
         { label: 'GitHub', href: 'https://…' }
       ]
     }
  ══════════════════════════════════════════════════════════ */
  const PROJECTS = [
    {
      title: '1130 Eastern Avenue — Interactive Model',
      year:  '2026',
      desc:  'A playable 3D model of an eight-unit flex building in Malden, MA. Orbit it, walk it in first person, or get in the pickup and drive the site — doors open, and every unit carries its own leasing data. Built in three.js and shipped as one self-contained HTML file that runs anywhere, offline.',
      tags:  ['three.js', 'WebGL', 'Game Design', 'Commercial Real Estate'],
      links: [
        { label: 'Play it', href: '1130-eastern-ave.html' }
      ]
    }
  ];

  /* ═══════════════════════════════════════════════════════════
     RENDER + BEHAVIOUR
  ══════════════════════════════════════════════════════════ */
  const esc = (str) => String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  function renderProjects() {
    const grid  = document.getElementById('projGrid');
    const empty = document.getElementById('projEmpty');

    if (!PROJECTS.length) {
      grid.hidden = true;
      empty.hidden = false;
      return;
    }

    empty.hidden = true;
    grid.hidden = false;

    grid.innerHTML = PROJECTS.map((p, i) => {
      const num   = String(i + 1).padStart(2, '0');
      const tags  = (p.tags || [])
        .map(t => `<span class="proj-tag">${esc(t)}</span>`).join('');
      const links = (p.links || [])
        .map(l => `<a class="proj-link" href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)} →</a>`).join('');

      return `
        <article class="proj-card">
          <div class="proj-card-top">
            <span class="proj-index">${num}</span>
            <span class="proj-year">${esc(p.year || '')}</span>
          </div>
          <h2 class="proj-title">${esc(p.title || 'Untitled')}</h2>
          <p class="proj-desc">${esc(p.desc || '')}</p>
          ${tags  ? `<div class="proj-tags">${tags}</div>` : ''}
          ${links ? `<div class="proj-links">${links}</div>` : ''}
        </article>`;
    }).join('');
  }

  /* ─── Theme toggle (shares the key with index.html) ─── */
  function initTheme() {
    const btn  = document.getElementById('themeBtn');
    const html = document.documentElement;

    try {
      const stored = localStorage.getItem('jn-theme');
      if (stored) html.dataset.theme = stored;
    } catch (e) {}

    if (!btn) return;

    btn.addEventListener('click', () => {
      const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
      html.dataset.theme = next;
      try { localStorage.setItem('jn-theme', next); } catch (e) {}
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderProjects();
    initTheme();
  });
  </script>
</body>
</html>
